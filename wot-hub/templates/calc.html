{% extends "base.html" %}

{% block title %}Калькулятор фарма - WoT Hub{% endblock %}

{% block content %}
<section class="calculator-section">
    <h1 class="page-title">💰 Калькулятор фарма премиум танков</h1>
    
    <div class="calculator-container">
        <div class="calculator-form">
            <div class="form-group">
                <label for="tankSelect">Выберите танк:</label>
                <select id="tankSelect" class="form-control">
                    {% for tank in tanks %}
                    <option value="{{ tank.id }}">{{ tank.name }} ({{ tank.tier }} ур.)</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="battles">Количество боев:</label>
                <input type="number" id="battles" class="form-control" value="10" min="1" max="100">
            </div>
            
            <div class="form-group">
                <label for="avgDamage">Средний урон за бой:</label>
                <input type="number" id="avgDamage" class="form-control" value="2000" min="0" max="10000">
            </div>
            
            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" id="premiumAccount" checked>
                    Премиум-аккаунт (+50% к кредитам)
                </label>
            </div>
            
            <div class="form-group">
                <label for="boosters">Личные бустеры (x1.15 за каждый):</label>
                <select id="boosters" class="form-control">
                    <option value="0">Нет бустеров</option>
                    <option value="1">1 бустер (+15%)</option>
                    <option value="2">2 бустера (+30%)</option>
                    <option value="3">3 бустера (+45%)</option>
                </select>
            </div>
            
            <button class="calculate-btn" onclick="calculateFarm()">
                Рассчитать прибыль
            </button>
        </div>
        
        <div class="calculator-results" id="calcResults">
            <h3>Результаты расчета</h3>
            <div class="result-item">
                <span>Прибыль за бой:</span>
                <span id="perBattle" class="result-value">0 ₵</span>
            </div>
            <div class="result-item">
                <span>Прибыль за сессию:</span>
                <span id="perSession" class="result-value">0 ₵</span>
            </div>
            
            <div class="result-breakdown">
                <h4>Детализация:</h4>
                <div id="breakdown"></div>
            </div>
            
            <!-- Визуальная шкала -->
            <div class="income-bar">
                <div class="bar-label">Эффективность фарма:</div>
                <div class="bar-container">
                    <div id="incomeBar" class="bar-fill"></div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
