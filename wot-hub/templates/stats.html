{% extends "base.html" %}

{% block title %}Статистика игрока - WoT Hub{% endblock %}

{% block content %}
<section class="stats-section">
    <h1 class="page-title">📊 Проверка статистики игрока</h1>
    
    <div class="search-container">
        <div class="search-form">
            <input type="text" id="nicknameInput" class="form-control" placeholder="Введите никнейм игрока...">
            <button class="search-btn" onclick="searchPlayer()">🔍 Найти</button>
        </div>
        
        <div id="statsResult" class="stats-result">
            <!-- Результаты будут здесь -->
        </div>
    </div>
    
    <div class="stats-info">
        <h3>Что мы показываем:</h3>
        <ul>
            <li>📈 Общий процент побед</li>
            <li>⚔️ Количество боев</li>
            <li>🎯 Средний урон</li>
            <li>🏆 Рейтинг WN8</li>
            <li>⭐ Знаки классности</li>
        </ul>
    </div>
</section>
{% endblock %}
