<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Lesta Hub</title>
    <style>
        :root {
            --bg-dark: #0b0f14;
            --bg-panel: #131a22;
            --bg-element: #1c2632;
            --border-color: #2a3744;
            --text-primary: #e6edf3;
            --text-secondary: #9aa7b3;
            --text-muted: #5c6b7a;
            --accent-gold: #d4af37;
            --accent-blue: #4a9eff;
            --accent-red: #ff5e5e;
            --accent-green: #3fb950;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .admin-wrapper {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: var(--accent-gold);
        }

        .login-form {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .login-form input {
            width: 100%;
            padding: 0.8rem;
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            margin-bottom: 1rem;
        }

        .login-form button {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
        }

        .admin-panel {
            display: none;
        }

        .section {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .section h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--accent-blue);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #ffd700;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--accent-red);
            color: #fff;
        }

        .btn-danger:hover {
            background: #ff3333;
        }

        .item-list {
            margin-top: 1rem;
        }

        .item {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            flex: 1;
        }

        .item-title {
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
        }

        .logout-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <h1>🔐 Админ-панель</h1>
        
        <div class="login-form" id="loginForm">
            <h2 style="margin-bottom: 1rem;">Введите пароль</h2>
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button onclick="checkPassword()">Войти</button>
        </div>

        <div class="admin-panel" id="adminPanel">
            <button class="logout-btn" onclick="logout()">Выйти</button>

            <div class="section">
                <h2>🎁 Добавить бонус-код</h2>
                <div class="form-group">
                    <label>Код</label>
                    <input type="text" id="bonusCode" placeholder="Например: LESTA2026">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="bonusDescription" placeholder="Что даёт этот код"></textarea>
                </div>
                <button class="btn" onclick="addBonusCode()">Добавить код</button>
            </div>

            <div class="section">
                <h2>📋 Список бонус-кодов</h2>
                <div id="bonusCodesList" class="item-list"></div>
            </div>
        </div>
    </div>

    <script>
        // Пароль
        const PASSWORD = '135710Aa!';
        
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            if (password === PASSWORD) {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadBonusCodesList();
            } else {
                alert('Неверный пароль');
            }
        }
        
        function logout() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        }
        
        // Работа с localStorage
        function getBonusCodes() {
            return JSON.parse(localStorage.getItem('lesta_bonus_codes') || '[]');
        }
        
        function saveBonusCodes(codes) {
            localStorage.setItem('lesta_bonus_codes', JSON.stringify(codes));
        }
        
        // Добавление бонус-кода
        function addBonusCode() {
            const code = document.getElementById('bonusCode').value;
            const description = document.getElementById('bonusDescription').value;
            
            if (!code) {
                alert('Введите код');
                return;
            }
            
            const codes = getBonusCodes();
            codes.push({
                id: Date.now(),
                code: code,
                description: description
            });
            
            saveBonusCodes(codes);
            loadBonusCodesList();
            
            document.getElementById('bonusCode').value = '';
            document.getElementById('bonusDescription').value = '';
            alert('Бонус-код добавлен!');
        }
        
        // Удаление бонус-кода
        function deleteBonusCode(id) {
            if (!confirm('Удалить бонус-код?')) return;
            
            const codes = getBonusCodes();
            const filtered = codes.filter(item => item.id !== id);
            saveBonusCodes(filtered);
            loadBonusCodesList();
        }
        
        // Загрузка списка бонус-кодов
        function loadBonusCodesList() {
            const bonusCodesList = document.getElementById('bonusCodesList');
            const codes = getBonusCodes();
            
            if (codes.length === 0) {
                bonusCodesList.innerHTML = '<div style="color: var(--text-muted);">Нет бонус-кодов</div>';
                return;
            }
            
            bonusCodesList.innerHTML = codes.map(item => `
                <div class="item">
                    <div class="item-info">
                        <div class="item-title">${item.code}</div>
                        <div class="item-meta">${item.description || 'Без описания'}</div>
                    </div>
                    <div class="item-actions">
                        <button class="btn btn-danger btn-small" onclick="deleteBonusCode(${item.id})">Удалить</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
