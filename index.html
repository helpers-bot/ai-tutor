<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesta Challenges</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bf00ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff88;
            --neon-orange: #ff6600;
            --neon-red: #ff0033;
            --neon-yellow: #ffcc00;
            --dark-bg: #0a0a1a;
            --card-bg: rgba(20, 20, 40, 0.9);
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 243, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(191, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.05) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes backgroundShift {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .bullet {
            position: fixed;
            width: 25px;
            height: 8px;
            background: linear-gradient(90deg, #ffcc00, #ff6600);
            border-radius: 4px;
            pointer-events: none;
            z-index: 0;
            animation: flyBullet linear infinite;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }

        .bullet::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-right: 6px solid #ff6600;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
        }

        @keyframes flyBullet {
            0% { left: -100px; transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
            100% { left: calc(100% + 100px); transform: rotate(360deg); }
        }

        .bullet:nth-child(1) { top: 5%; animation-duration: 3s; animation-delay: 0s; }
        .bullet:nth-child(2) { top: 15%; animation-duration: 4s; animation-delay: 1s; }
        .bullet:nth-child(3) { top: 25%; animation-duration: 3.5s; animation-delay: 2s; }
        .bullet:nth-child(4) { top: 35%; animation-duration: 5s; animation-delay: 0.5s; }
        .bullet:nth-child(5) { top: 45%; animation-duration: 3.8s; animation-delay: 1.5s; }
        .bullet:nth-child(6) { top: 55%; animation-duration: 4.2s; animation-delay: 2.5s; }
        .bullet:nth-child(7) { top: 65%; animation-duration: 3.2s; animation-delay: 3s; }
        .bullet:nth-child(8) { top: 75%; animation-duration: 4.5s; animation-delay: 1.8s; }
        .bullet:nth-child(9) { top: 85%; animation-duration: 3.6s; animation-delay: 0.8s; }
        .bullet:nth-child(10) { top: 95%; animation-duration: 4.8s; animation-delay: 2.2s; }

        .sidebar {
            position: fixed;
            top: 0;
            width: 180px;
            height: 100%;
            background: rgba(10, 10, 26, 0.95);
            border: 1px solid rgba(0, 243, 255, 0.2);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            overflow: hidden;
        }

        .sidebar-left {
            left: 0;
            border-right: 2px solid rgba(0, 243, 255, 0.3);
        }

        .sidebar-right {
            right: 0;
            border-left: 2px solid rgba(191, 0, 255, 0.3);
        }

        .sidebar-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-left .sidebar-title {
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .sidebar-right .sidebar-title {
            color: var(--neon-purple);
            text-shadow: 0 0 10px rgba(191, 0, 255, 0.5);
        }

        .sponsor-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 10px;
            animation: scrollSponsors 20s linear infinite;
        }

        @keyframes scrollSponsors {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
        }

        .sponsor-item {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            padding: 8px 10px;
            text-align: center;
            font-size: 0.9em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.3s;
        }

        .sponsor-item:hover {
            background: rgba(0, 243, 255, 0.3);
            transform: scale(1.05);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            margin-left: 200px;
            margin-right: 200px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.3em;
            font-weight: bold;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.3s;
            color: white;
        }

        .btn-danger {
            background: var(--neon-red);
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .login-form {
            max-width: 350px;
            margin: 50px auto;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 15px;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            text-align: center;
        }

        .login-form h2 {
            margin-bottom: 15px;
            color: var(--neon-blue);
        }

        .login-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon-blue);
            border-radius: 8px;
            color: white;
            font-size: 0.9em;
            outline: none;
        }

        .login-form input:focus {
            border-color: var(--neon-purple);
        }

        .btn-primary {
            background: var(--neon-blue);
            color: var(--dark-bg);
            width: 100%;
        }

        .profile-section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.3);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .profile-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
        }

        .profile-nickname {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--neon-blue);
        }

        .balance-display {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .section-title {
            font-size: 1em;
            margin-bottom: 10px;
            color: var(--neon-purple);
        }

        .achievements-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .achievement-badge {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-purple);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8em;
            text-align: center;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9em;
        }

        .notification {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--neon-green);
            color: var(--dark-bg);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 2000;
            font-weight: bold;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>

    <div class="sidebar sidebar-left">
        <div class="sidebar-title">Спонсоры</div>
        <div class="sponsor-list" id="sponsorsList"></div>
    </div>

    <div class="sidebar sidebar-right">
        <div class="sidebar-title">Топ 3</div>
        <div class="sponsor-list" id="topSponsorsList"></div>
    </div>

    <div class="container">
        <div class="login-form" id="loginForm">
            <h2>LESTA CHALLENGES</h2>
            <input type="text" id="nicknameInput" placeholder="Ваш никнейм">
            <button class="btn btn-primary" id="loginBtn">ВОЙТИ</button>
        </div>

        <div id="mainContent" style="display: none;">
            <div class="header">
                <div class="logo">LESTA CHALLENGES</div>
                <button class="btn btn-danger" id="logoutBtn">Выйти</button>
            </div>

            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-avatar" id="avatarLetter">?</div>
                    <div>
                        <div class="profile-nickname" id="profileNickname"></div>
                        <div class="balance-display">⭐ <span id="balanceDisplay">0</span></div>
                    </div>
                </div>

                <div class="section-title">🏆 Достижения</div>
                <div class="achievements-row" id="achievementsRow">
                    <div class="achievement-badge">🎯 Первый вход</div>
                    <div class="achievement-badge">💎 1000 урона</div>
                    <div class="achievement-badge">🔥 5 побед</div>
                </div>

                <div class="section-title">📜 История</div>
                <div class="history-list" id="historyList">
                    <div class="history-item">Выполнен челлендж: 5000 урона</div>
                    <div class="history-item">Создан челлендж: 3 победы</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sponsors = [
            'TankMaster_77', 'SteelWarrior', 'ProGamer_Lesta', 'TankDestroyer', 
            'BattleHero_2024', 'IronCommander', 'ShadowTank', 'Victory_Road', 
            'TankAce_99', 'WarLegend', 'SteelStorm', 'TankHunter_X', 
            'BlitzKrieg', 'ArmoredCore', 'TankElite'
        ];

        const topSponsors = ['🏆 TankMaster_77', '🥈 SteelWarrior', '🥉 ProGamer_Lesta'];

        function initSponsors() {
            document.getElementById('sponsorsList').innerHTML = 
                sponsors.map(s => '<div class="sponsor-item">' + s + '</div>').join('');
            
            document.getElementById('topSponsorsList').innerHTML = 
                topSponsors.map(s => '<div class="sponsor-item">' + s + '</div>').join('');
        }

        function showNotification(message) {
            var n = document.createElement('div');
            n.className = 'notification';
            n.textContent = message;
            document.body.appendChild(n);
            setTimeout(function() { n.remove(); }, 3000);
        }

        function login() {
            var nickname = document.getElementById('nicknameInput').value.trim();
            
            if (!nickname) {
                showNotification('Введите никнейм!');
                return;
            }
            
            var users = JSON.parse(localStorage.getItem('users') || '[]');
            var user = users.find(function(u) { return u.nickname === nickname; });
            
            if (!user) {
                user = {
                    nickname: nickname,
                    balance: 100
                };
                users.push(user);
                localStorage.setItem('users', JSON.stringify(users));
            }
            
            localStorage.setItem('currentUser', JSON.stringify(user));
            
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            
            document.getElementById('profileNickname').textContent = user.nickname;
            document.getElementById('avatarLetter').textContent = user.nickname[0].toUpperCase();
            document.getElementById('balanceDisplay').textContent = user.balance;
            
            showNotification('Добро пожаловать, ' + nickname + '!');
        }

        function logout() {
            localStorage.removeItem('currentUser');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('nicknameInput').value = '';
        }

        document.addEventListener('DOMContentLoaded', function() {
            initSponsors();
            document.getElementById('loginBtn').addEventListener('click', login);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            
            var savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                var user = JSON.parse(savedUser);
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('profileNickname').textContent = user.nickname;
                document.getElementById('avatarLetter').textContent = user.nickname[0].toUpperCase();
                document.getElementById('balanceDisplay').textContent = user.balance;
            }
        });
    </script>
</body>
</html>
