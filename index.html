<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesta Hub — статистика игроков Мир Танков</title>
    <style>
        :root {
            --bg-dark: #0b0f14;
            --bg-panel: #131a22;
            --bg-element: #1c2632;
            --border-color: #2a3744;
            --text-primary: #e6edf3;
            --text-secondary: #9aa7b3;
            --text-muted: #5c6b7a;
            --accent-gold: #d4af37;
            --accent-blue: #4a9eff;
            --accent-red: #ff5e5e;
            --accent-green: #3fb950;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1200px;
        }

        .search-section {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .search-section h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--accent-gold);
        }

        .search-box {
            display: flex;
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 0.8rem 1.2rem;
            background: var(--bg-element);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
        }

        .search-btn {
            padding: 0.8rem 2rem;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #ffd700;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .stats-container {
            margin-top: 2rem;
            display: none;
        }

        .stats-container.active {
            display: block;
        }

        .player-header {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .player-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
        }

        .player-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .info-item {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-card {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
        }

        .stat-title {
            font-size: 0.9rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        .error {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 94, 94, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 12px;
            color: var(--accent-red);
            margin-top: 1rem;
        }

        .api-link {
            text-align: center;
            margin-top: 1rem;
        }

        .api-link a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .api-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="search-section">
            <h1>🔍 Поиск игрока Мир Танков</h1>
            <div class="search-box">
                <input type="text" class="search-input" id="playerSearch" placeholder="Введите ник игрока...">
                <button class="search-btn" onclick="searchPlayer()">Найти</button>
            </div>
            <div id="errorContainer"></div>
            <div id="loadingContainer" class="loading" style="display: none;">Загрузка данных...</div>
            
            <div class="stats-container" id="statsContainer">
                <div id="playerStats"></div>
            </div>
            
            <div class="api-link">
                <a href="https://developers.lesta.ru/reference/all/wot/account/info/" target="_blank">Документация API Lesta</a>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация API Lesta
        const API_CONFIG = {
            baseUrl: 'https://api.worldoftanks.ru/wot/',
            applicationId: 'demo', // Замените на свой application_id
            realm: 'ru'
        };

        // Функция для выполнения запросов к API
        async function apiRequest(endpoint, params = {}) {
            const queryParams = new URLSearchParams({
                application_id: API_CONFIG.applicationId,
                ...params
            });
            
            const url = `${API_CONFIG.baseUrl}${endpoint}/?${queryParams}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // Функция поиска игрока
        async function searchPlayer() {
            const nickname = document.getElementById('playerSearch').value.trim();
            
            if (!nickname) {
                showError('Введите ник игрока');
                return;
            }
            
            const loadingContainer = document.getElementById('loadingContainer');
            const errorContainer = document.getElementById('errorContainer');
            const statsContainer = document.getElementById('statsContainer');
            
            loadingContainer.style.display = 'block';
            errorContainer.innerHTML = '';
            statsContainer.classList.remove('active');
            
            try {
                // Шаг 1: Поиск игрока по нику
                const searchResult = await apiRequest('account/list', {
                    search: nickname,
                    type: 'exact'
                });
                
                if (searchResult.status !== 'ok' || !searchResult.data || searchResult.data.length === 0) {
                    throw new Error('Игрок не найден');
                }
                
                const accountId = searchResult.data[0].account_id;
                
                // Шаг 2: Получение информации об игроке
                const playerInfo = await apiRequest('account/info', {
                    account_id: accountId,
                    fields: 'account_id,nickname,created_at,last_battle_time,global_rating,clan_id,statistics'
                });
                
                if (playerInfo.status !== 'ok' || !playerInfo.data || !playerInfo.data[accountId]) {
                    throw new Error('Не удалось получить информацию об игроке');
                }
                
                const playerData = playerInfo.data[accountId];
                
                // Шаг 3: Получение расширенной статистики
                const statsData = await apiRequest('account/info', {
                    account_id: accountId,
                    fields: 'statistics.all,statistics.rating,statistics.frags,statistics.max_xp,statistics.max_damage'
                });
                
                if (statsData.status !== 'ok' || !statsData.data || !statsData.data[accountId]) {
                    throw new Error('Не удалось получить статистику');
                }
                
                const statistics = statsData.data[accountId].statistics;
                
                // Шаг 4: Получение данных о последних боях (если доступно)
                let recentBattles = null;
                try {
                    const battlesData = await apiRequest('account/list', {
                        account_id: accountId,
                        limit: 100
                    });
                    
                    if (battlesData.status === 'ok') {
                        recentBattles = battlesData.data;
                    }
                } catch (e) {
                    console.warn('Не удалось получить данные о последних боях');
                }
                
                // Отображение данных
                displayPlayerStats(playerData, statistics, recentBattles);
                
            } catch (error) {
                showError(`Ошибка: ${error.message}`);
            } finally {
                loadingContainer.style.display = 'none';
            }
        }

        // Функция отображения статистики игрока
        function displayPlayerStats(playerData, statistics, recentBattles) {
            const statsContainer = document.getElementById('statsContainer');
            const playerStats = document.getElementById('playerStats');
            
            const allStats = statistics?.all || {};
            const ratingStats = statistics?.rating || {};
            
            const html = `
                <div class="player-header">
                    <div class="player-name">${playerData.nickname || 'Неизвестно'}</div>
                    <div style="color: var(--text-secondary);">
                        ID: ${playerData.account_id} | Создан: ${formatDate(playerData.created_at)}
                    </div>
                    <div style="color: var(--text-secondary);">
                        Последний бой: ${formatDate(playerData.last_battle_time)} | Глобальный рейтинг: ${playerData.global_rating || 'Н/Д'}
                    </div>
                </div>
                
                <div class="player-info-grid">
                    <div class="info-item">
                        <div class="info-label">Боёв всего</div>
                        <div class="info-value">${allStats.battles || 0}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Процент побед</div>
                        <div class="info-value">${allStats.wins ? ((allStats.wins / allStats.battles * 100).toFixed(2)) : 0}%</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Средний урон</div>
                        <div class="info-value">${allStats.damage_dealt ? Math.round(allStats.damage_dealt / allStats.battles) : 0}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Средний опыт</div>
                        <div class="info-value">${allStats.xp ? Math.round(allStats.xp / allStats.battles) : 0}</div>
                    </div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-title">Всего боёв</div>
                        <div class="stat-value">${allStats.battles || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Победы</div>
                        <div class="stat-value">${allStats.wins || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Поражения</div>
                        <div class="stat-value">${allStats.losses || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Выжил в боях</div>
                        <div class="stat-value">${allStats.survived_battles || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Уничтожено танков</div>
                        <div class="stat-value">${allStats.frags || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Средний урон</div>
                        <div class="stat-value">${allStats.damage_dealt ? Math.round(allStats.damage_dealt / allStats.battles) : 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Максимальный урон</div>
                        <div class="stat-value">${statistics?.max_damage || 'Н/Д'}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Максимальный опыт</div>
                        <div class="stat-value">${statistics?.max_xp || 'Н/Д'}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Общий урон</div>
                        <div class="stat-value">${allStats.damage_dealt || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Общий опыт</div>
                        <div class="stat-value">${allStats.xp || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Захват базы</div>
                        <div class="stat-value">${allStats.capture_points || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Защита базы</div>
                        <div class="stat-value">${allStats.dropped_capture_points || 0}</div>
                    </div>
                </div>
                
                <div class="player-info-grid" style="margin-top: 1rem;">
                    <div class="info-item">
                        <div class="info-label">Рейтинг WN8</div>
                        <div class="info-value">${ratingStats?.wn8 || 'Н/Д'}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Рейтинг WGR</div>
                        <div class="info-value">${ratingStats?.wgr || 'Н/Д'}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Эффективность</div>
                        <div class="info-value">${ratingStats?.efficiency || 'Н/Д'}</div>
                    </div>
                </div>
            `;
            
            playerStats.innerHTML = html;
            statsContainer.classList.add('active');
        }

        // Функция форматирования даты
        function formatDate(timestamp) {
            if (!timestamp) return 'Н/Д';
            const date = new Date(timestamp * 1000);
            return date.toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        // Функция отображения ошибки
        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
        }

        // Обработка нажатия Enter в поле поиска
        document.getElementById('playerSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchPlayer();
            }
        });
    </script>
</body>
</html>
