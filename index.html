<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesta Hub — статистика, фарм и бонус-коды Мир Танков</title>
    <style>
        :root {
            --bg-dark: #0b0f14;
            --bg-panel: #131a22;
            --bg-element: #1c2632;
            --border-color: #2a3744;
            --text-primary: #e6edf3;
            --text-secondary: #9aa7b3;
            --text-muted: #5c6b7a;
            --accent-gold: #d4af37;
            --accent-blue: #4a9eff;
            --accent-red: #ff5e5e;
            --accent-green: #3fb950;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1400px;
        }

        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .action-btn {
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 60px;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .btn-farm {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn-farm:hover {
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
        }

        .btn-codes {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-codes:hover {
            background: rgba(74, 158, 255, 0.1);
            box-shadow: 0 10px 25px rgba(74, 158, 255, 0.3);
        }

        .search-section {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .search-section h2 {
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--accent-gold);
        }

        .search-box {
            display: flex;
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 0.8rem 1.2rem;
            background: var(--bg-element);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
        }

        .search-btn {
            padding: 0.8rem 2rem;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #ffd700;
            transform: translateY(-2px);
        }

        .stats-container {
            margin-top: 2rem;
            display: none;
        }

        .stats-container.active {
            display: block;
        }

        .player-header {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .player-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-card {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
        }

        .stat-title {
            font-size: 0.85rem;
            color: var(--accent-blue);
            margin-bottom: 0.3rem;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 1rem;
            color: var(--accent-blue);
        }

        .error {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 94, 94, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 12px;
            color: var(--accent-red);
            margin-top: 1rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--accent-gold);
            border-radius: 16px;
            padding: 2rem;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }

        .modal-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .farm-calculator {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .btn-calculate {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
            margin-top: 1rem;
        }

        .result-box {
            background: var(--bg-element);
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .bonus-code-item {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }

        .bonus-code-item .code {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .tank-list-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .farm-calculator {
                grid-template-columns: 1fr;
            }
            .top-buttons {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="top-buttons">
            <button class="action-btn btn-farm" id="btnFarm">💰 Калькулятор фарма</button>
            <button class="action-btn btn-codes" id="btnCodes">🎁 Бонус-коды</button>
        </div>

        <div class="search-section">
            <h2>🔍 Поиск игрока Мир Танков</h2>
            <div class="search-box">
                <input type="text" class="search-input" id="playerSearch" placeholder="Введите ник игрока...">
                <button class="search-btn" id="searchBtn">Найти</button>
            </div>
            <div id="errorContainer"></div>
            <div id="loadingContainer" class="loading" style="display: none;">Загрузка данных...</div>
            <div class="stats-container" id="statsContainer">
                <div id="playerStats"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно фарма -->
    <div id="farmModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="closeFarmModal">&times;</button>
            <div class="modal-title">💰 Калькулятор фарма кредитов</div>
            <div class="farm-calculator">
                <div>
                    <h3 style="color: var(--accent-gold); margin-bottom: 1rem;">Топ-10 премиум танков</h3>
                    <div id="topTanksList"></div>
                </div>
                <div>
                    <h3 style="color: var(--accent-gold); margin-bottom: 1rem;">Расчёт доходности</h3>
                    <div class="form-group">
                        <label>Танк</label>
                        <select id="tankSelect">
                            <option value="">Выберите танк</option>
                            <option value="skorpion-g">Skorpion G (8 ур.) ★</option>
                            <option value="lowe">Löwe (8 ур.) ★</option>
                            <option value="progetto-46">Progetto M35 mod. 46 (8 ур.) ★</option>
                            <option value="su-130pm">СУ-130ПМ (8 ур.) ★</option>
                            <option value="strv-s1">Strv S1 (8 ур.) ★</option>
                            <option value="wz-120-1g-ft">WZ-120-1G FT (8 ур.) ★</option>
                            <option value="amx-cda-105">AMX Canon d'assaut 105 (8 ур.) ★</option>
                            <option value="somua-sm">Somua SM (8 ур.) ★</option>
                            <option value="obj-703-ii">Объект 703 Вариант II (8 ур.) ★</option>
                            <option value="bisonte-c45">Bisonte C45 (8 ур.) ★</option>
                            <option value="is-7">ИС-7 (10 ур.)</option>
                            <option value="obj-277">Объект 277 (10 ур.)</option>
                            <option value="t-62a">Т-62А (10 ур.)</option>
                            <option value="e-100">E 100 (10 ур.)</option>
                            <option value="leopard-1">Leopard 1 (10 ур.)</option>
                            <option value="t110e5">T110E5 (10 ур.)</option>
                            <option value="amx-50b">AMX 50 B (10 ур.)</option>
                            <option value="fv215b">FV215b (10 ур.)</option>
                            <option value="progetto-65">Progetto M40 mod. 65 (10 ур.)</option>
                            <option value="kranvagn">Kranvagn (10 ур.)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Премиум аккаунт</label>
                        <select id="premiumSelect">
                            <option value="yes">Да (+50% кредитов)</option>
                            <option value="no">Нет</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Количество боёв</label>
                        <input type="number" id="battlesInput" value="10" min="1" max="100">
                    </div>
                    <button class="btn-calculate" id="calculateBtn">Рассчитать доход</button>
                    <div id="resultBox" class="result-box" style="display: none;">
                        <h3>Результат расчёта</h3>
                        <p>Средний доход за бой: <strong id="avgIncome"></strong></p>
                        <p>Общий доход за <span id="totalBattles"></span> боёв: <strong id="totalIncome"></strong></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно бонус-кодов -->
    <div id="codesModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="closeCodesModal">&times;</button>
            <div class="modal-title">🎁 Актуальные бонус-коды</div>
            <div id="bonusCodesList"></div>
        </div>
    </div>

    <script>
        // Глобальные функции
        window.searchPlayer = async function() {
            const nickname = document.getElementById('playerSearch').value.trim();
            
            if (!nickname) {
                showError('Введите ник игрока');
                return;
            }
            
            const loadingContainer = document.getElementById('loadingContainer');
            const errorContainer = document.getElementById('errorContainer');
            const statsContainer = document.getElementById('statsContainer');
            
            loadingContainer.style.display = 'block';
            errorContainer.innerHTML = '';
            statsContainer.classList.remove('active');
            
            try {
                // Используем прокси для обхода CORS
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const apiBase = 'https://api.worldoftanks.ru/wot/';
                const appId = 'demo';
                
                // Поиск аккаунта
                const searchApiUrl = `${apiBase}account/list/?application_id=${appId}&search=${encodeURIComponent(nickname)}&type=exact`;
                const searchResponse = await fetch(proxyUrl + encodeURIComponent(searchApiUrl));
                const searchData = await searchResponse.json();
                
                if (searchData.status !== 'ok' || !searchData.data || searchData.data.length === 0) {
                    throw new Error('Игрок не найден');
                }
                
                const accountId = searchData.data[0].account_id;
                
                // Получение статистики
                const statsApiUrl = `${apiBase}account/info/?application_id=${appId}&account_id=${accountId}&fields=account_id,nickname,created_at,last_battle_time,global_rating,statistics.all`;
                const statsResponse = await fetch(proxyUrl + encodeURIComponent(statsApiUrl));
                const statsData = await statsResponse.json();
                
                if (statsData.status !== 'ok' || !statsData.data || !statsData.data[accountId]) {
                    throw new Error('Не удалось получить статистику');
                }
                
                const playerData = statsData.data[accountId];
                displayPlayerStats(playerData);
                
            } catch (error) {
                showError(`Ошибка: ${error.message}`);
            } finally {
                loadingContainer.style.display = 'none';
            }
        };

        window.displayPlayerStats = function(playerData) {
            const statsContainer = document.getElementById('statsContainer');
            const playerStats = document.getElementById('playerStats');
            
            const all = playerData.statistics?.all || {};
            
            const wins = all.wins || 0;
            const battles = all.battles || 0;
            const winRate = battles > 0 ? ((wins / battles) * 100).toFixed(2) : 0;
            const avgDamage = battles > 0 ? Math.round((all.damage_dealt || 0) / battles) : 0;
            const avgXp = battles > 0 ? Math.round((all.xp || 0) / battles) : 0;
            
            const html = `
                <div class="player-header">
                    <div class="player-name">${playerData.nickname || 'Неизвестно'}</div>
                    <div style="color: var(--text-secondary);">
                        ID: ${playerData.account_id} | Создан: ${formatDate(playerData.created_at)}
                    </div>
                    <div style="color: var(--text-secondary);">
                        Последний бой: ${formatDate(playerData.last_battle_time)} | Рейтинг: ${playerData.global_rating || 'Н/Д'}
                    </div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-title">Всего боёв</div>
                        <div class="stat-value">${battles}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Процент побед</div>
                        <div class="stat-value">${winRate}%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Средний урон</div>
                        <div class="stat-value">${avgDamage}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Средний опыт</div>
                        <div class="stat-value">${avgXp}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Победы</div>
                        <div class="stat-value">${wins}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Поражения</div>
                        <div class="stat-value">${all.losses || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Уничтожено танков</div>
                        <div class="stat-value">${all.frags || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Выжил в боях</div>
                        <div class="stat-value">${all.survived_battles || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Общий урон</div>
                        <div class="stat-value">${all.damage_dealt || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Общий опыт</div>
                        <div class="stat-value">${all.xp || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Захват базы</div>
                        <div class="stat-value">${all.capture_points || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Защита базы</div>
                        <div class="stat-value">${all.dropped_capture_points || 0}</div>
                    </div>
                </div>
            `;
            
            playerStats.innerHTML = html;
            statsContainer.classList.add('active');
        };

        window.formatDate = function(timestamp) {
            if (!timestamp) return 'Н/Д';
            const date = new Date(timestamp * 1000);
            return date.toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        };

        window.showError = function(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
        };

        // Привязка событий
        document.getElementById('searchBtn').addEventListener('click', window.searchPlayer);
        document.getElementById('playerSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                window.searchPlayer();
            }
        });

        // Калькулятор фарма
        const tankIncome = {
            'skorpion-g': { name: 'Skorpion G', tier: 8, premium: true, baseIncome: 82000 },
            'lowe': { name: 'Löwe', tier: 8, premium: true, baseIncome: 80000 },
            'progetto-46': { name: 'Progetto M35 mod. 46', tier: 8, premium: true, baseIncome: 80000 },
            'su-130pm': { name: 'СУ-130ПМ', tier: 8, premium: true, baseIncome: 78000 },
            'strv-s1': { name: 'Strv S1', tier: 8, premium: true, baseIncome: 79000 },
            'wz-120-1g-ft': { name: 'WZ-120-1G FT', tier: 8, premium: true, baseIncome: 80000 },
            'amx-cda-105': { name: 'AMX Canon d\'assaut 105', tier: 8, premium: true, baseIncome: 81000 },
            'somua-sm': { name: 'Somua SM', tier: 8, premium: true, baseIncome: 79000 },
            'obj-703-ii': { name: 'Объект 703 Вариант II', tier: 8, premium: true, baseIncome: 75000 },
            'bisonte-c45': { name: 'Bisonte C45', tier: 8, premium: true, baseIncome: 77000 },
            'is-7': { name: 'ИС-7', tier: 10, premium: false, baseIncome: 65000 },
            'obj-277': { name: 'Объект 277', tier: 10, premium: false, baseIncome: 62000 },
            't-62a': { name: 'Т-62А', tier: 10, premium: false, baseIncome: 58000 },
            'e-100': { name: 'E 100', tier: 10, premium: false, baseIncome: 63000 },
            'leopard-1': { name: 'Leopard 1', tier: 10, premium: false, baseIncome: 59000 },
            't110e5': { name: 'T110E5', tier: 10, premium: false, baseIncome: 61000 },
            'amx-50b': { name: 'AMX 50 B', tier: 10, premium: false, baseIncome: 59000 },
            'fv215b': { name: 'FV215b', tier: 10, premium: false, baseIncome: 60000 },
            'progetto-65': { name: 'Progetto M40 mod. 65', tier: 10, premium: false, baseIncome: 57000 },
            'kranvagn': { name: 'Kranvagn', tier: 10, premium: false, baseIncome: 57000 }
        };

        document.getElementById('btnFarm').addEventListener('click', () => {
            document.getElementById('farmModal').classList.add('active');
            
            const topTanksList = document.getElementById('topTanksList');
            const topTanks = Object.values(tankIncome)
                .filter(tank => tank.premium)
                .sort((a, b) => b.baseIncome - a.baseIncome)
                .slice(0, 10);
            
            topTanksList.innerHTML = topTanks.map((tank, index) => `
                <div class="tank-list-item">
                    <span>${index + 1}. ${tank.name}</span>
                    <span style="color: var(--accent-gold);">★ ${tank.tier} ур.</span>
                </div>
            `).join('');
        });

        document.getElementById('btnCodes').addEventListener('click', () => {
            document.getElementById('codesModal').classList.add('active');
            
            const bonusCodesList = document.getElementById('bonusCodesList');
            const codes = JSON.parse(localStorage.getItem('lesta_bonus_codes') || '[]');
            
            if (codes.length === 0) {
                bonusCodesList.innerHTML = '<div style="text-align: center; color: var(--text-muted);">Нет добавленных бонус-кодов</div>';
            } else {
                bonusCodesList.innerHTML = codes.map(code => `
                    <div class="bonus-code-item">
                        <div class="code">${code.code}</div>
                        <div style="color: var(--text-secondary); margin-top: 0.3rem;">${code.description || 'Описание отсутствует'}</div>
                    </div>
                `).join('');
            }
        });

        document.getElementById('closeFarmModal').addEventListener('click', () => {
            document.getElementById('farmModal').classList.remove('active');
        });

        document.getElementById('closeCodesModal').addEventListener('click', () => {
            document.getElementById('codesModal').classList.remove('active');
        });

        document.getElementById('calculateBtn').addEventListener('click', () => {
            const tankId = document.getElementById('tankSelect').value;
            const battles = parseInt(document.getElementById('battlesInput').value) || 10;
            const isPremium = document.getElementById('premiumSelect').value === 'yes';
            
            if (!tankId) {
                alert('Выберите танк');
                return;
            }
            
            const tank = tankIncome[tankId];
            if (!tank) {
                alert('Танк не найден');
                return;
            }
            
            let baseIncome = tank.baseIncome;
            if (isPremium) baseIncome *= 1.5;
            if (tank.premium) baseIncome *= 1.2;
            
            const totalIncome = baseIncome * battles;
            
            document.getElementById('avgIncome').textContent = Math.round(baseIncome).toLocaleString() + ' кредитов';
            document.getElementById('totalBattles').textContent = battles;
            document.getElementById('totalIncome').textContent = Math.round(totalIncome).toLocaleString() + ' кредитов';
            document.getElementById('resultBox').style.display = 'block';
        });
    </script>
</body>
</html>
