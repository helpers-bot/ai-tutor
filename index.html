<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Танковый портал - Neon</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bf00ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff88;
            --neon-orange: #ff6600;
            --neon-red: #ff0033;
            --dark-bg: #0a0a1a;
            --darker-bg: #050510;
            --card-bg: rgba(20, 20, 40, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Анимированный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 243, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(191, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.05) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes backgroundShift {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Сетка на фоне */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(transparent 0%, rgba(0, 243, 255, 0.03) 50%, transparent 100%),
                repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(0, 243, 255, 0.02) 50px, rgba(0, 243, 255, 0.02) 51px),
                repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(0, 243, 255, 0.02) 50px, rgba(0, 243, 255, 0.02) 51px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Экран входа */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-screen h1 {
            font-size: 4em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
        }

        @keyframes gradientShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }

        .login-screen p {
            font-size: 1.3em;
            margin-bottom: 40px;
            color: var(--text-secondary);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .login-btn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            color: white;
            border: 2px solid var(--neon-blue);
            padding: 18px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5), 0 0 40px rgba(191, 0, 255, 0.3);
            animation: buttonGlow 2s ease-in-out infinite;
        }

        @keyframes buttonGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.5), 0 0 40px rgba(191, 0, 255, 0.3); }
            50% { box-shadow: 0 0 40px rgba(0, 243, 255, 0.8), 0 0 80px rgba(191, 0, 255, 0.5); }
        }

        .login-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px rgba(0, 243, 255, 1), 0 0 120px rgba(191, 0, 255, 0.8);
        }

        .login-btn:active {
            transform: scale(0.95);
        }

        /* Профиль */
        .profile-section {
            margin-bottom: 30px;
            animation: slideInLeft 0.5s ease-out;
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(10px);
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { border-color: var(--neon-blue); box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); }
            50% { border-color: var(--neon-purple); box-shadow: 0 0 50px rgba(191, 0, 255, 0.5); }
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            padding: 3px;
            animation: avatarGlow 2s ease-in-out infinite;
        }

        @keyframes avatarGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
            50% { box-shadow: 0 0 40px rgba(191, 0, 255, 0.8); }
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: var(--dark-bg);
        }

        .profile-info {
            flex: 1;
            min-width: 200px;
        }

        .profile-info h2 {
            font-size: 2em;
            margin-bottom: 15px;
            cursor: pointer;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.3s;
        }

        .profile-info h2:hover {
            transform: scale(1.05);
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .profile-edit {
            display: flex;
            gap: 10px;
            align-items: center;
            animation: slideInRight 0.3s ease-out;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .profile-edit input {
            padding: 10px;
            font-size: 1em;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon-blue);
            border-radius: 10px;
            flex: 1;
            color: white;
            transition: all 0.3s;
        }

        .profile-edit input:focus {
            outline: none;
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        .save-btn {
            background: linear-gradient(45deg, var(--neon-green), var(--neon-blue));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .save-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
        }

        .balance {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: balancePulse 2s ease-in-out infinite;
        }

        @keyframes balancePulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.8); }
        }

        /* Достижения */
        .achievements {
            margin: 20px 0;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.3);
            backdrop-filter: blur(10px);
            animation: slideInRight 0.5s ease-out;
        }

        .achievements h3 {
            margin-bottom: 20px;
            font-size: 1.5em;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .achievements-list {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 50px;
        }

        .achievement-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.3);
            transition: all 0.3s;
        }

        .achievement-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.5);
        }

        .empty-state {
            color: #666;
            font-style: italic;
        }

        /* Кнопки команд */
        .team-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            animation: slideInUp 0.5s ease-out;
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .team-btn {
            padding: 15px 30px;
            border: 2px solid transparent;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .create-team-btn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .join-team-btn {
            background: linear-gradient(45deg, var(--neon-orange), var(--neon-red));
            border-color: var(--neon-orange);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
        }

        .team-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 40px currentColor;
        }

        .team-btn:active {
            transform: translateY(0) scale(0.95);
        }

        /* Лента команд */
        .teams-feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .team-card {
            background: var(--card-bg);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            backdrop-filter: blur(10px);
            animation: cardAppear 0.5s ease-out;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .team-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .team-card.open {
            border-color: var(--neon-green);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .team-card.closed {
            border-color: var(--neon-red);
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.3);
        }

        .team-status {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.9em;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .team-status.open {
            background: rgba(0, 255, 136, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .team-status.closed {
            background: rgba(255, 0, 51, 0.2);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
        }

        .team-card h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .team-card p {
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .team-card p strong {
            color: var(--text-primary);
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 25px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.5);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-content h2 {
            margin-bottom: 30px;
            font-size: 1.8em;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #444;
            border-radius: 10px;
            font-size: 1em;
            color: white;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .submit-btn {
            background: linear-gradient(45deg, var(--neon-green), var(--neon-blue));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            width: 100%;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.8);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 1.8em;
            color: #999;
            background: none;
            border: none;
            transition: all 0.3s;
            z-index: 10;
        }

        .close-btn:hover {
            color: var(--neon-red);
            transform: rotate(90deg);
        }

        /* Кнопки поддержки и чата */
        .bottom-buttons {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .action-btn {
            padding: 15px 30px;
            border: 2px solid transparent;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            color: white;
            font-size: 1em;
            letter-spacing: 0.5px;
        }

        .support-btn {
            background: linear-gradient(45deg, #607D8B, #455A64);
            border-color: #607D8B;
            box-shadow: 0 0 20px rgba(96, 125, 139, 0.5);
        }

        .chat-btn {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.5);
        }

        .action-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 40px rgba(191, 0, 255, 0.8);
        }

        .action-btn:active {
            transform: translateY(0) scale(0.95);
        }

        /* Чат */
        .chat-window {
            position: fixed;
            bottom: 90px;
            right: 30px;
            width: 400px;
            height: 500px;
            background: var(--card-bg);
            border-radius: 25px;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 50px rgba(191, 0, 255, 0.5);
            display: none;
            flex-direction: column;
            z-index: 200;
            backdrop-filter: blur(10px);
            animation: modalSlideIn 0.3s ease-out;
        }

        .chat-window.active {
            display: flex;
        }

        .chat-header {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            padding: 20px;
            border-radius: 23px 23px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .chat-message {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
            animation: messageAppear 0.3s ease-out;
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .chat-message-content {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #444;
        }

        .chat-message-user {
            font-weight: bold;
            color: var(--neon-blue);
            margin-bottom: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-message-user:hover {
            color: var(--neon-purple);
            text-shadow: 0 0 10px rgba(191, 0, 255, 0.5);
        }

        .chat-message-text {
            color: var(--text-secondary);
            word-wrap: break-word;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            gap: 10px;
            border-top: 2px solid #333;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #444;
            border-radius: 25px;
            font-size: 0.9em;
            color: white;
            transition: all 0.3s;
        }

        .chat-input input:focus {
            outline: none;
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.3);
        }

        .chat-input button {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.5);
        }

        .chat-input button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.8);
        }

        /* Уведомления */
        .notification {
            position: fixed;
            top: 30px;
            right: 30px;
            background: linear-gradient(45deg, var(--neon-green), var(--neon-blue));
            color: white;
            padding: 20px 30px;
            border-radius: 50px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            z-index: 300;
            animation: slideInRight 0.3s ease-out;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Экран входа -->
        <div id="loginScreen" class="login-screen">
            <h1>🎮 ТАНКОВЫЙ ПОРТАЛ</h1>
            <p>Добро пожаловать! Войдите через Lesta Games</p>
            <button class="login-btn" onclick="login()">ВХОД</button>
        </div>

        <!-- Основной контент -->
        <div id="mainContent" style="display: none;">
            <!-- Профиль -->
            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-avatar" onclick="document.getElementById('avatarUpload').click()">
                        <img id="avatarImg" src="https://www.gravatar.com/avatar/default?d=mp" alt="Avatar">
                    </div>
                    <div class="profile-info">
                        <h2 id="username" onclick="editUsername()">Пользователь</h2>
                        <div class="profile-edit" id="usernameEdit" style="display: none;">
                            <input type="text" id="usernameInput" placeholder="Введите новый ник">
                            <button class="save-btn" onclick="saveUsername()">Сохранить</button>
                        </div>
                        <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
                        <button onclick="document.getElementById('avatarUpload').click()" class="team-btn" style="margin-top: 10px; background: linear-gradient(45deg, #607D8B, #455A64); border-color: #607D8B;">📷 Изменить фото</button>
                    </div>
                    <div class="balance">
                        ⭐ <span id="balanceDisplay">100</span> звёзд
                    </div>
                </div>
            </div>

            <!-- Достижения -->
            <div class="achievements">
                <h3>🏆 Достижения</h3>
                <div class="achievements-list" id="achievementsList">
                    <p class="empty-state">Пока нет достижений</p>
                </div>
            </div>

            <!-- Кнопки команд -->
            <div class="team-buttons">
                <button class="team-btn create-team-btn" onclick="openCreateTeamModal()">➕ СОЗДАТЬ КОМАНДУ</button>
                <button class="team-btn join-team-btn" onclick="openJoinTeamModal()">🔍 ПРИСОЕДИНИТЬСЯ</button>
            </div>

            <!-- Лента команд -->
            <div class="teams-feed" id="teamsFeed"></div>
        </div>

        <!-- Кнопки внизу -->
        <div class="bottom-buttons">
            <button class="action-btn support-btn" onclick="openSupport()">🛠 ПОДДЕРЖКА</button>
            <button class="action-btn chat-btn" onclick="toggleChat()">💬 ОБЩИЙ ЧАТ</button>
        </div>

        <!-- Окно чата -->
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <h3>Общий чат</h3>
                <button class="close-btn" onclick="toggleChat()" style="position: static;">×</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Введите сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- Модальное окно создания команды -->
        <div class="modal" id="createTeamModal">
            <div class="modal-content">
                <button class="close-btn" onclick="closeCreateTeamModal()">×</button>
                <h2>СОЗДАТЬ КОМАНДУ</h2>
                <form id="createTeamForm">
                    <div class="form-group">
                        <label>Название команды</label>
                        <input type="text" id="teamName" required>
                    </div>
                    <div class="form-group">
                        <label>Количество игроков в команде А</label>
                        <input type="number" id="teamASize" min="1" value="5" required>
                    </div>
                    <div class="form-group">
                        <label>Количество игроков в команде Б</label>
                        <input type="number" id="teamBSize" min="1" value="5" required>
                    </div>
                    <div class="form-group">
                        <label>Танки команды А (необязательно)</label>
                        <input type="text" id="teamATanks" placeholder="Например: Т-34, КВ-1">
                    </div>
                    <div class="form-group">
                        <label>Танки команды Б (необязательно)</label>
                        <input type="text" id="teamBTanks" placeholder="Например: Пантера, Тигр">
                    </div>
                    <div class="form-group">
                        <label>Взнос с игрока команды А (минимум 10 звёзд)</label>
                        <input type="number" id="teamAFee" min="10" value="10" required>
                    </div>
                    <div class="form-group">
                        <label>Взнос с игрока команды Б (минимум 10 звёзд)</label>
                        <input type="number" id="teamBFee" min="10" value="10" required>
                    </div>
                    <div class="form-group">
                        <label>Карта</label>
                        <input type="text" id="mapName" required placeholder="Например: Прохоровка">
                    </div>
                    <div class="form-group">
                        <label>Условия победы</label>
                        <textarea id="winConditions" required placeholder="Опишите условия победы"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Пароль (оставьте пустым для открытой комнаты)</label>
                        <input type="password" id="teamPassword" placeholder="Пароль для закрытой комнаты">
                    </div>
                    <button type="submit" class="submit-btn">СОЗДАТЬ</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно присоединения -->
        <div class="modal" id="joinTeamModal">
            <div class="modal-content">
                <button class="close-btn" onclick="closeJoinTeamModal()">×</button>
                <h2>ПРИСОЕДИНИТЬСЯ К КОМАНДЕ</h2>
                <div id="availableTeams"></div>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация Supabase
        const SUPABASE_URL = 'https://scavytmpqhgszatvgfsp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TCcyt1VNFASqRjUCe52H1A_z_WA6zoW';
        
        let supabase;
        let currentUser = null;
        let currentProfile = null;
        
        // Инициализация Supabase с проверкой
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (error) {
            console.error('Ошибка инициализации Supabase:', error);
            supabase = null;
        }

        // Функция входа (демо-режим)
        async function login() {
            try {
                currentUser = {
                    id: 'demo-user-' + Date.now(),
                    email: 'demo@example.com'
                };
                
                currentProfile = {
                    id: currentUser.id,
                    username: 'Танкист_' + Math.floor(Math.random() * 1000),
                    avatar_url: 'https://www.gravatar.com/avatar/default?d=mp',
                    balance: 100
                };
                
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                localStorage.setItem('currentProfile', JSON.stringify(currentProfile));
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
                await loadUserProfile();
                await loadTeams();
                await loadMessages();
                
                showNotification('✅ Вы успешно вошли!');
            } catch (error) {
                console.error('Ошибка входа:', error);
                alert('Ошибка входа. Попробуйте еще раз.');
            }
        }

        // Загрузка профиля
        async function loadUserProfile() {
            if (!currentProfile) {
                const savedProfile = localStorage.getItem('currentProfile');
                if (savedProfile) {
                    currentProfile = JSON.parse(savedProfile);
                } else {
                    return;
                }
            }
            
            document.getElementById('username').textContent = currentProfile.username || 'Пользователь';
            document.getElementById('balanceDisplay').textContent = currentProfile.balance || 0;
            if (currentProfile.avatar_url) {
                document.getElementById('avatarImg').src = currentProfile.avatar_url;
            }
        }

        // Редактирование имени пользователя
        function editUsername() {
            const usernameEdit = document.getElementById('usernameEdit');
            const usernameDisplay = document.getElementById('username');
            
            usernameEdit.style.display = 'flex';
            usernameDisplay.style.display = 'none';
            document.getElementById('usernameInput').value = currentProfile.username;
        }

        async function saveUsername() {
            const newUsername = document.getElementById('usernameInput').value.trim();
            if (!newUsername) {
                alert('Введите имя пользователя');
                return;
            }
            
            currentProfile.username = newUsername;
            localStorage.setItem('currentProfile', JSON.stringify(currentProfile));
            
            document.getElementById('username').textContent = newUsername;
            document.getElementById('usernameEdit').style.display = 'none';
            document.getElementById('username').style.display = 'block';
            
            showNotification('✅ Никнейм обновлен!');
        }

        // Загрузка аватара
        document.getElementById('avatarUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                currentProfile.avatar_url = event.target.result;
                localStorage.setItem('currentProfile', JSON.stringify(currentProfile));
                document.getElementById('avatarImg').src = event.target.result;
                showNotification('✅ Аватар обновлен!');
            };
            reader.readAsDataURL(file);
        });

        // Открытие модального окна создания команды
        function openCreateTeamModal() {
            document.getElementById('createTeamModal').classList.add('active');
        }

        function closeCreateTeamModal() {
            document.getElementById('createTeamModal').classList.remove('active');
        }

        // Открытие модального окна присоединения
        function openJoinTeamModal() {
            document.getElementById('joinTeamModal').classList.add('active');
            loadAvailableTeams();
        }

        function closeJoinTeamModal() {
            document.getElementById('joinTeamModal').classList.remove('active');
        }

        // Загрузка доступных команд
        function loadAvailableTeams() {
            const teams = JSON.parse(localStorage.getItem('teams') || '[]');
            const teamsDiv = document.getElementById('availableTeams');
            teamsDiv.innerHTML = '';
            
            if (teams.length === 0) {
                teamsDiv.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">Нет доступных команд</p>';
                return;
            }
            
            teams.filter(t => t.status === 'waiting').forEach(team => {
                const teamCard = document.createElement('div');
                teamCard.className = 'team-card ' + (team.is_open ? 'open' : 'closed');
                teamCard.innerHTML = `
                    <span class="team-status ${team.is_open ? 'open' : 'closed'}">
                        ${team.is_open ? '✅ Открыта' : '🔒 Закрыта'}
                    </span>
                    <h3>${team.title}</h3>
                    <p><strong>Карта:</strong> ${team.map_name}</p>
                    <p><strong>Игроки:</strong> А: ${team.members_a || 0}/${team.team_a_size} | Б: ${team.members_b || 0}/${team.team_b_size}</p>
                    <p><strong>Взнос:</strong> ${team.team_a_fee}⭐ за игрока</p>
                    <button onclick="joinTeam(${team.id})" class="submit-btn" style="margin-top: 15px;">ПРИСОЕДИНИТЬСЯ</button>
                `;
                teamsDiv.appendChild(teamCard);
            });
        }

        // Создание команды
        document.getElementById('createTeamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentProfile) {
                alert('Войдите в систему');
                return;
            }
            
            const teamData = {
                id: Date.now(),
                creator_id: currentProfile.id,
                creator_name: currentProfile.username,
                title: document.getElementById('teamName').value,
                team_a_size: parseInt(document.getElementById('teamASize').value),
                team_b_size: parseInt(document.getElementById('teamBSize').value),
                team_a_tanks: document.getElementById('teamATanks').value,
                team_b_tanks: document.getElementById('teamBTanks').value,
                team_a_fee: parseInt(document.getElementById('teamAFee').value),
                team_b_fee: parseInt(document.getElementById('teamBFee').value),
                map_name: document.getElementById('mapName').value,
                win_conditions: document.getElementById('winConditions').value,
                password: document.getElementById('teamPassword').value,
                is_open: !document.getElementById('teamPassword').value,
                status: 'waiting',
                members_a: 0,
                members_b: 0,
                created_at: new Date().toISOString()
            };
            
            const teams = JSON.parse(localStorage.getItem('teams') || '[]');
            teams.push(teamData);
            localStorage.setItem('teams', JSON.stringify(teams));
            
            document.getElementById('createTeamForm').reset();
            
            showNotification('✅ Команда создана!');
            closeCreateTeamModal();
            await loadTeams();
        });

        // Загрузка команд в ленту
        async function loadTeams() {
            const teams = JSON.parse(localStorage.getItem('teams') || '[]');
            const teamsFeed = document.getElementById('teamsFeed');
            teamsFeed.innerHTML = '';
            
            if (teams.length === 0) {
                teamsFeed.innerHTML = '<p style="color: #999; grid-column: 1/-1; text-align: center; padding: 40px;">Нет созданных команд</p>';
                return;
            }
            
            teams.filter(t => t.status === 'waiting').forEach(team => {
                const teamCard = document.createElement('div');
                teamCard.className = 'team-card ' + (team.is_open ? 'open' : 'closed');
                teamCard.innerHTML = `
                    <span class="team-status ${team.is_open ? 'open' : 'closed'}">
                        ${team.is_open ? '✅ Открыта' : '🔒 Закрыта'}
                    </span>
                    <h3>${team.title}</h3>
                    <p><strong>Создатель:</strong> ${team.creator_name}</p>
                    <p><strong>Карта:</strong> ${team.map_name}</p>
                    <p><strong>Игроки:</strong> А: ${team.members_a}/${team.team_a_size} | Б: ${team.members_b}/${team.team_b_size}</p>
                    <p><strong>Взнос:</strong> ${team.team_a_fee}⭐ за игрока</p>
                    <p><strong>Общий банк:</strong> ${calculateTotalBank(team)}⭐</p>
                `;
                teamCard.onclick = () => showTeamDetails(team.id);
                teamsFeed.appendChild(teamCard);
            });
        }

        // Расчет общего банка
        function calculateTotalBank(team) {
            const totalFees = (team.team_a_size * team.team_a_fee) + (team.team_b_size * team.team_b_fee);
            return Math.floor(totalFees * 0.9);
        }

        // Присоединение к команде
        function joinTeam(teamId) {
            const teams = JSON.parse(localStorage.getItem('teams') || '[]');
            const teamIndex = teams.findIndex(t => t.id === teamId);
            
            if (teamIndex === -1) {
                alert('Команда не найдена');
                return;
            }
            
            const team = teams[teamIndex];
            
            if (!team.is_open) {
                const password = prompt('Введите пароль для входа в команду:');
                if (password !== team.password) {
                    alert('Неверный пароль!');
                    return;
                }
            }
            
            if (team.members_a < team.team_a_size) {
                team.members_a++;
                team.members_a_list = team.members_a_list || [];
                team.members_a_list.push(currentProfile.username);
            } else if (team.members_b < team.team_b_size) {
                team.members_b++;
                team.members_b_list = team.members_b_list || [];
                team.members_b_list.push(currentProfile.username);
            } else {
                alert('Команда заполнена!');
                return;
            }
            
            teams[teamIndex] = team;
            localStorage.setItem('teams', JSON.stringify(teams));
            
            showNotification('✅ Вы присоединились к команде!');
            closeJoinTeamModal();
            loadTeams();
        }

        // Показать детали команды
        function showTeamDetails(teamId) {
            const teams = JSON.parse(localStorage.getItem('teams') || '[]');
            const team = teams.find(t => t.id === teamId);
            
            if (team) {
                const details = `
                    КОМАНДА: ${team.title}
                    Создатель: ${team.creator_name}
                    Статус: ${team.is_open ? 'Открыта' : 'Закрыта'}
                    
                    КАРТА: ${team.map_name}
                    
                    КОМАНДА А:
                    - Игроки: ${team.members_a}/${team.team_a_size}
                    - Танки: ${team.team_a_tanks || 'Не указаны'}
                    - Взнос: ${team.team_a_fee}⭐
                    
                    КОМАНДА Б:
                    - Игроки: ${team.members_b}/${team.team_b_size}
                    - Танки: ${team.team_b_tanks || 'Не указаны'}
                    - Взнос: ${team.team_b_fee}⭐
                    
                    ОБЩИЙ БАНК: ${calculateTotalBank(team)}⭐
                    
                    УСЛОВИЯ ПОБЕДЫ: ${team.win_conditions}
                `;
                
                alert(details);
            }
        }

        // Чат функции
        function toggleChat() {
            const chatWindow = document.getElementById('chatWindow');
            chatWindow.classList.toggle('active');
            if (chatWindow.classList.contains('active')) {
                loadMessages();
            }
        }

        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem('chatMessages') || '[]');
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            
            if (messages.length === 0) {
                chatMessages.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">Нет сообщений</p>';
                return;
            }
            
            messages.slice(-50).forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'chat-message';
                messageDiv.innerHTML = `
                    <img src="${msg.avatar_url || 'https://www.gravatar.com/avatar/default?d=mp'}" 
                         alt="Avatar" onclick="viewProfile('${msg.user_id}')">
                    <div class="chat-message-content">
                        <div class="chat-message-user" onclick="viewProfile('${msg.user_id}')">
                            ${msg.username}
                        </div>
                        <div class="chat-message-text">${msg.message}</div>
                        <small style="color: #666;">${new Date(msg.timestamp).toLocaleTimeString()}</small>
                    </div>
                `;
                chatMessages.appendChild(messageDiv);
            });
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message || !currentProfile) {
                if (!currentProfile) {
                    alert('Войдите в систему');
                }
                return;
            }
            
            const messages = JSON.parse(localStorage.getItem('chatMessages') || '[]');
            messages.push({
                user_id: currentProfile.id,
                username: currentProfile.username,
                avatar_url: currentProfile.avatar_url,
                message: message,
                timestamp: new Date().toISOString()
            });
            
            localStorage.setItem('chatMessages', JSON.stringify(messages));
            input.value = '';
            loadMessages();
        }

        // Просмотр профиля
        function viewProfile(userId) {
            if (userId === currentProfile?.id) {
                alert(`Это ваш профиль!\nИмя: ${currentProfile.username}\nБаланс: ${currentProfile.balance}⭐`);
                return;
            }
            
            alert('Профиль пользователя\nПользователь найден в чате');
        }

        // Поддержка
        function openSupport() {
            const supportInfo = `
                🛠 СЛУЖБА ПОДДЕРЖКИ
                
                📧 Email: support@tankportal.ru
                💬 Telegram: @tank_support
                📞 Телефон: 8-800-123-45-67
                
                Режим работы: 24/7
            `;
            alert(supportInfo);
        }

        // Уведомления
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('currentUser');
            const savedProfile = localStorage.getItem('currentProfile');
            
            if (savedUser && savedProfile) {
                currentUser = JSON.parse(savedUser);
                currentProfile = JSON.parse(savedProfile);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadUserProfile();
                loadTeams();
                loadMessages();
            }
        });

        // Обработка нажатия Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCreateTeamModal();
                closeJoinTeamModal();
                const chatWindow = document.getElementById('chatWindow');
                if (chatWindow.classList.contains('active')) {
                    chatWindow.classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
