<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Танковый портал</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 1200px;
            min-height: 600px;
            padding: 30px;
            position: relative;
        }

        /* Экран входа */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }

        .login-screen h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #333;
        }

        .login-screen p {
            font-size: 1.2em;
            margin-bottom: 40px;
            color: #666;
        }

        .login-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        /* Профиль */
        .profile-section {
            display: none;
            margin-bottom: 30px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
        }

        .profile-info h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .profile-info input {
            padding: 8px;
            font-size: 1.1em;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .balance {
            background: #FFD700;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Достижения */
        .achievements {
            margin: 20px 0;
        }

        .achievements h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .achievements-list {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 50px;
        }

        .achievement-item {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        /* Кнопки команд */
        .team-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .team-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .create-team-btn {
            background: #2196F3;
            color: white;
        }

        .join-team-btn {
            background: #FF9800;
            color: white;
        }

        .team-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Лента команд */
        .teams-feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .team-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .team-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateY(-3px);
        }

        .team-card.open {
            border-left: 5px solid #4CAF50;
        }

        .team-card.closed {
            border-left: 5px solid #f44336;
        }

        .team-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .team-status.open {
            background: #d4edda;
            color: #155724;
        }

        .team-status.closed {
            background: #f8d7da;
            color: #721c24;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .submit-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
        }

        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 1.5em;
            color: #666;
        }

        /* Кнопки поддержки и чата */
        .bottom-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .support-btn {
            background: #607D8B;
            color: white;
        }

        .chat-btn {
            background: #9C27B0;
            color: white;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }

        /* Чат */
        .chat-window {
            position: absolute;
            bottom: 70px;
            right: 20px;
            width: 350px;
            height: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
        }

        .chat-header {
            background: #9C27B0;
            color: white;
            padding: 15px;
            border-radius: 10px 10px 0 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .chat-message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .chat-message img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        .chat-message-content {
            flex: 1;
        }

        .chat-message-user {
            font-weight: bold;
            color: #333;
            margin-bottom: 3px;
            cursor: pointer;
        }

        .chat-message-text {
            color: #666;
        }

        .chat-input {
            display: flex;
            padding: 10px;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
        }

        .chat-input button {
            background: #9C27B0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Экран входа -->
        <div id="loginScreen" class="login-screen">
            <h1>🎮 Танковый портал</h1>
            <p>Добро пожаловать! Войдите через Lesta Games</p>
            <button class="login-btn" onclick="login()">Вход</button>
        </div>

        <!-- Основной контент -->
        <div id="mainContent" style="display: none;">
            <!-- Профиль -->
            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <img id="avatarImg" src="https://www.gravatar.com/avatar/default" alt="Avatar">
                    </div>
                    <div class="profile-info">
                        <h2 id="username">Пользователь</h2>
                        <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
                        <button onclick="document.getElementById('avatarUpload').click()" class="team-btn" style="margin-top: 10px;">Изменить фото</button>
                    </div>
                    <div class="balance">
                        ⭐ <span id="balanceDisplay">0</span> звёзд
                    </div>
                </div>
            </div>

            <!-- Достижения -->
            <div class="achievements">
                <h3>🏆 Достижения</h3>
                <div class="achievements-list" id="achievementsList">
                    <p style="color: #999;">Пока нет достижений</p>
                </div>
            </div>

            <!-- Кнопки команд -->
            <div class="team-buttons">
                <button class="team-btn create-team-btn" onclick="openCreateTeamModal()">Создать команду</button>
                <button class="team-btn join-team-btn" onclick="openJoinTeamModal()">Присоединиться к команде</button>
            </div>

            <!-- Лента команд -->
            <div class="teams-feed" id="teamsFeed"></div>
        </div>

        <!-- Кнопки внизу -->
        <div class="bottom-buttons">
            <button class="action-btn support-btn" onclick="openSupport()">Поддержка</button>
            <button class="action-btn chat-btn" onclick="toggleChat()">Общий чат</button>
        </div>

        <!-- Окно чата -->
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <h3>Общий чат</h3>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Введите сообщение...">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>

        <!-- Модальное окно создания команды -->
        <div class="modal" id="createTeamModal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeCreateTeamModal()">&times;</span>
                <h2>Создать команду</h2>
                <form id="createTeamForm">
                    <div class="form-group">
                        <label>Название команды</label>
                        <input type="text" id="teamName" required>
                    </div>
                    <div class="form-group">
                        <label>Количество игроков в команде А</label>
                        <input type="number" id="teamASize" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Количество игроков в команде Б</label>
                        <input type="number" id="teamBSize" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Танки команды А (необязательно)</label>
                        <input type="text" id="teamATanks" placeholder="Например: Т-34, КВ-1">
                    </div>
                    <div class="form-group">
                        <label>Танки команды Б (необязательно)</label>
                        <input type="text" id="teamBTanks" placeholder="Например: Пантера, Тигр">
                    </div>
                    <div class="form-group">
                        <label>Взнос с игрока команды А (минимум 10 звёзд)</label>
                        <input type="number" id="teamAFee" min="10" required>
                    </div>
                    <div class="form-group">
                        <label>Взнос с игрока команды Б (минимум 10 звёзд)</label>
                        <input type="number" id="teamBFee" min="10" required>
                    </div>
                    <div class="form-group">
                        <label>Карта</label>
                        <input type="text" id="mapName" required>
                    </div>
                    <div class="form-group">
                        <label>Условия победы</label>
                        <textarea id="winConditions" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Пароль (оставьте пустым для открытой комнаты)</label>
                        <input type="password" id="teamPassword">
                    </div>
                    <button type="submit" class="submit-btn">Создать</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно присоединения -->
        <div class="modal" id="joinTeamModal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeJoinTeamModal()">&times;</span>
                <h2>Присоединиться к команде</h2>
                <div id="availableTeams"></div>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация Supabase
        const SUPABASE_URL = 'https://scavytmpqhgszatvgfsp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TCcyt1VNFASqRjUCe52H1A_z_WA6zoW';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;

        // Функция входа
        async function login() {
            // Здесь должна быть интеграция с Lesta Games
            // Для демонстрации используем временную авторизацию
            const { data, error } = await supabase.auth.signInWithPassword({
                email: 'demo@example.com',
                password: 'demo123'
            });
            
            if (error) {
                // Если пользователь не существует, создаем его
                const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
                    email: 'demo@example.com',
                    password: 'demo123'
                });
                
                if (signUpError) {
                    alert('Ошибка входа: ' + signUpError.message);
                    return;
                }
                
                currentUser = signUpData.user;
            } else {
                currentUser = data.user;
            }
            
            await loadUserProfile();
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            await loadTeams();
        }

        // Загрузка профиля
        async function loadUserProfile() {
            if (!currentUser) return;
            
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();
            
            if (profile) {
                document.getElementById('username').textContent = profile.username || 'Пользователь';
                document.getElementById('balanceDisplay').textContent = profile.balance || 0;
                if (profile.avatar_url) {
                    document.getElementById('avatarImg').src = profile.avatar_url;
                }
            }
        }

        // Открытие модального окна создания команды
        function openCreateTeamModal() {
            document.getElementById('createTeamModal').style.display = 'flex';
        }

        function closeCreateTeamModal() {
            document.getElementById('createTeamModal').style.display = 'none';
        }

        // Открытие модального окна присоединения
        async function openJoinTeamModal() {
            document.getElementById('joinTeamModal').style.display = 'flex';
            const { data: teams, error } = await supabase
                .from('teams')
                .select('*')
                .eq('status', 'waiting');
            
            const teamsDiv = document.getElementById('availableTeams');
            teamsDiv.innerHTML = '';
            
            if (teams) {
                teams.forEach(team => {
                    const teamCard = document.createElement('div');
                    teamCard.className = 'team-card ' + (team.is_open ? 'open' : 'closed');
                    teamCard.innerHTML = `
                        <h3>${team.title}</h3>
                        <p>Карта: ${team.map_name}</p>
                        <p>Игроки А: 0/${team.team_a_size} | Б: 0/${team.team_b_size}</p>
                        <p>Взнос: ${team.team_a_fee}⭐</p>
                        <button onclick="joinTeam(${team.id})" class="submit-btn" style="margin-top: 10px;">Присоединиться</button>
                    `;
                    teamsDiv.appendChild(teamCard);
                });
            }
        }

        function closeJoinTeamModal() {
            document.getElementById('joinTeamModal').style.display = 'none';
        }

        // Создание команды
        document.getElementById('createTeamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const teamData = {
                creator_id: currentUser.id,
                title: document.getElementById('teamName').value,
                team_a_size: parseInt(document.getElementById('teamASize').value),
                team_b_size: parseInt(document.getElementById('teamBSize').value),
                team_a_tanks: document.getElementById('teamATanks').value,
                team_b_tanks: document.getElementById('teamBTanks').value,
                team_a_fee: parseInt(document.getElementById('teamAFee').value),
                team_b_fee: parseInt(document.getElementById('teamBFee').value),
                map_name: document.getElementById('mapName').value,
                win_conditions: document.getElementById('winConditions').value,
                password: document.getElementById('teamPassword').value,
                is_open: !document.getElementById('teamPassword').value
            };
            
            const { data, error } = await supabase
                .from('teams')
                .insert([teamData]);
            
            if (error) {
                alert('Ошибка создания команды: ' + error.message);
            } else {
                alert('Команда создана!');
                closeCreateTeamModal();
                await loadTeams();
            }
        });

        // Загрузка команд в ленту
        async function loadTeams() {
            const { data: teams, error } = await supabase
                .from('teams')
                .select('*')
                .eq('status', 'waiting')
                .order('created_at', { ascending: false });
            
            const teamsFeed = document.getElementById('teamsFeed');
            teamsFeed.innerHTML = '';
            
            if (teams) {
                teams.forEach(team => {
                    const teamCard = document.createElement('div');
                    teamCard.className = 'team-card ' + (team.is_open ? 'open' : 'closed');
                    teamCard.innerHTML = `
                        <span class="team-status ${team.is_open ? 'open' : 'closed'}">
                            ${team.is_open ? '✅ Открыта' : '🔒 Закрыта'}
                        </span>
                        <h3>${team.title}</h3>
                        <p><strong>Карта:</strong> ${team.map_name}</p>
                        <p><strong>Игроки:</strong> А: 0/${team.team_a_size} | Б: 0/${team.team_b_size}</p>
                        <p><strong>Взнос:</strong> ${team.team_a_fee}⭐ за игрока</p>
                        <p><strong>Общий банк:</strong> ${calculateTotalBank(team)}⭐</p>
                    `;
                    teamCard.onclick = () => showTeamDetails(team.id);
                    teamsFeed.appendChild(teamCard);
                });
            }
        }

        // Расчет общего банка
        function calculateTotalBank(team) {
            const totalFees = (team.team_a_size * team.team_a_fee) + (team.team_b_size * team.team_b_fee);
            return Math.floor(totalFees * 0.9); // Минус 10% комиссия
        }

        // Присоединение к команде
        async function joinTeam(teamId) {
            const teamData = {
                team_id: teamId,
                user_id: currentUser.id,
                team_side: 'A' // По умолчанию присоединяемся к команде А
            };
            
            const { data, error } = await supabase
                .from('team_members')
                .insert([teamData]);
            
            if (error) {
                alert('Ошибка присоединения: ' + error.message);
            } else {
                alert('Вы присоединились к команде!');
                closeJoinTeamModal();
                await loadTeams();
            }
        }

        // Показать детали команды
        async function showTeamDetails(teamId) {
            const { data: team, error } = await supabase
                .from('teams')
                .select('*')
                .eq('id', teamId)
                .single();
            
            if (team) {
                alert(`
                    Команда: ${team.title}
                    Карта: ${team.map_name}
                    Игроки А: 0/${team.team_a_size}
                    Игроки Б: 0/${team.team_b_size}
                    Танки А: ${team.team_a_tanks || 'Не указаны'}
                    Танки Б: ${team.team_b_tanks || 'Не указаны'}
                    Взнос А: ${team.team_a_fee}⭐
                    Взнос Б: ${team.team_b_fee}⭐
                    Общий банк: ${calculateTotalBank(team)}⭐
                    Условия победы: ${team.win_conditions}
                `);
            }
        }

        // Чат функции
        function toggleChat() {
            const chatWindow = document.getElementById('chatWindow');
            if (chatWindow.style.display === 'flex') {
                chatWindow.style.display = 'none';
            } else {
                chatWindow.style.display = 'flex';
                loadMessages();
            }
        }

        async function loadMessages() {
            const { data: messages, error } = await supabase
                .from('chat_messages')
                .select(`
                    *,
                    profiles:user_id (username, avatar_url)
                `)
                .order('created_at', { ascending: true })
                .limit(50);
            
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            
            if (messages) {
                messages.forEach(msg => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'chat-message';
                    messageDiv.innerHTML = `
                        <img src="${msg.profiles?.avatar_url || 'https://www.gravatar.com/avatar/default'}" 
                             alt="Avatar" onclick="viewProfile('${msg.user_id}')">
                        <div class="chat-message-content">
                            <div class="chat-message-user" onclick="viewProfile('${msg.user_id}')">
                                ${msg.profiles?.username || 'Пользователь'}
                            </div>
                            <div class="chat-message-text">${msg.message}</div>
                        </div>
                    `;
                    chatMessages.appendChild(messageDiv);
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const { data, error } = await supabase
                .from('chat_messages')
                .insert([{
                    user_id: currentUser.id,
                    message: message
                }]);
            
            if (error) {
                alert('Ошибка отправки сообщения');
            } else {
                input.value = '';
                await loadMessages();
            }
        }

        // Просмотр профиля
        async function viewProfile(userId) {
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', userId)
                .single();
            
            if (profile) {
                alert(`
                    Профиль пользователя
                    Имя: ${profile.username}
                    Баланс: ${profile.balance}⭐
                `);
            }
        }

        // Поддержка
        function openSupport() {
            alert('Служба поддержки\nEmail: support@tankportal.ru\nTelegram: @tank_support');
        }

        // Загрузка аватара
        document.getElementById('avatarUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const fileExt = file.name.split('.').pop();
            const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;
            
            const { data, error } = await supabase.storage
                .from('avatars')
                .upload(fileName, file);
            
            if (error) {
                alert('Ошибка загрузки аватара');
                return;
            }
            
            const { data: publicUrl } = supabase.storage
                .from('avatars')
                .getPublicUrl(fileName);
            
            await supabase
                .from('profiles')
                .update({ avatar_url: publicUrl.publicUrl })
                .eq('id', currentUser.id);
            
            document.getElementById('avatarImg').src = publicUrl.publicUrl;
            alert('Аватар обновлен!');
        });

        // Чат в реальном времени
        supabase
            .channel('chat')
            .on('postgres_changes', { 
                event: 'INSERT', 
                schema: 'public', 
                table: 'chat_messages' 
            }, () => {
                loadMessages();
            })
            .subscribe();
    </script>
</body>
</html>
