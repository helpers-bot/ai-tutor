<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesta Hub — фарм и бонус-коды Мир Танков</title>
    <style>
        :root {
            --bg-dark: #0b0f14;
            --bg-panel: #131a22;
            --bg-element: #1c2632;
            --border-color: #2a3744;
            --text-primary: #e6edf3;
            --text-secondary: #9aa7b3;
            --text-muted: #5c6b7a;
            --accent-gold: #d4af37;
            --accent-blue: #4a9eff;
            --accent-red: #ff5e5e;
            --accent-green: #3fb950;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1400px;
        }

        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .action-btn {
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 60px;
            padding: 0.8rem 2rem;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .btn-farm {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn-farm:hover {
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
        }

        .btn-codes {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-codes:hover {
            background: rgba(74, 158, 255, 0.1);
            box-shadow: 0 10px 25px rgba(74, 158, 255, 0.3);
        }

        .news-section {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .news-section h2 {
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.8rem;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .news-card {
            background: var(--bg-element);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .news-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .news-card-image {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            background-color: #2a3744;
            position: relative;
        }

        .news-card-content {
            padding: 1.2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .news-date {
            font-size: 0.8rem;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .news-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            color: #fff;
            line-height: 1.3;
        }

        .news-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .news-category {
            font-size: 0.8rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.8rem;
        }

        /* Модальное окно новости */
        .news-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .news-modal-overlay.active {
            display: flex;
        }

        .news-modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--accent-gold);
            border-radius: 16px;
            padding: 0;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .news-modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .news-modal-close:hover {
            background: rgba(255,0,0,0.8);
            transform: rotate(90deg);
        }

        .news-modal-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 16px 16px 0 0;
            display: block;
        }

        .news-modal-body {
            padding: 2rem;
        }

        .news-modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: #fff;
        }

        .news-modal-date {
            font-size: 0.9rem;
            color: var(--accent-gold);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .news-modal-text {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .news-modal-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
            padding: 0.8rem 1.5rem;
            background: var(--bg-element);
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .news-modal-link:hover {
            background: var(--accent-blue);
            color: #fff;
            text-decoration: none;
        }

        /* Остальные модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--accent-gold);
            border-radius: 16px;
            padding: 2rem;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }

        .modal-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .farm-calculator {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .form-group select:focus, .form-group input:focus {
            border-color: var(--accent-gold);
        }

        .btn-calculate {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-calculate:hover {
            background: #ffd700;
            transform: translateY(-2px);
        }

        .result-box {
            background: var(--bg-element);
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .result-box h3 {
            color: var(--accent-green);
            margin-bottom: 0.5rem;
        }

        .bonus-code-item {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }

        .bonus-code-item .code {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .bonus-code-item .reward {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .tank-list-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .tank-list-item:hover {
            background: rgba(74, 158, 255, 0.1);
        }

        @media (max-width: 768px) {
            .farm-calculator {
                grid-template-columns: 1fr;
            }
            .top-buttons {
                gap: 1rem;
            }
            .action-btn {
                padding: 0.6rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>

    </div>

                        <select id="nationSelect">
                            <option value="">Все нации</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Тип техники</label>
                        <select id="typeSelect">
                            <option value="">Все типы</option>
                            <option value="heavyTank">Тяжёлые танки (ТТ)</option>
                            <option value="mediumTank">Средние танки (СТ)</option>
                            <option value="lightTank">Лёгкие танки (ЛТ)</option>
                            <option value="AT-SPG">ПТ-САУ</option>
                            <option value="SPG">САУ (Артиллерия)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Уровень танка</label>
                        <select id="tierSelect">
                            <option value="">Все уровни</option>
                            <option value="8">VIII уровень</option>
                            <option value="9">IX уровень</option>
                            <option value="10">X уровень</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Танк</label>
                        <select id="tankSelect">
                            <option value="">Выберите танк</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Премиум аккаунт</label>
                        <select id="premiumSelect">
                            <option value="yes">Да</option>
                            <option value="no">Нет</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Количество боёв</label>
                        <input type="number" id="battlesInput" value="10" min="1" max="100">
                    </div>
                    <button class="btn-calculate" id="calculateBtn">Рассчитать доход</button>
                    <div id="resultBox" class="result-box" style="display: none;">
                        <h3>Результат расчёта</h3>
                        <p>Средний доход за бой: <strong id="avgIncome"></strong></p>
                        <p>Общий доход за <span id="totalBattles"></span> боёв: <strong id="totalIncome"></strong></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

                        { id: 'tvp-t50-51', name: 'TVP T 50/51', tier: 10, type: 'mediumTank', isPremium: false, baseIncome: 58000 },
                        { id: 'skoda-t56', name: 'Škoda T 56', tier: 8, type: 'heavyTank', isPremium: true, baseIncome: 78000 },
                        { id: 'skoda-t27', name: 'Škoda T 27', tier: 8, type: 'mediumTank', isPremium: true, baseIncome: 73000 }
                    ]
                },
                'sweden': {
                    name: 'Швеция',
                    tanks: [
                        { id: 'kranvagn', name: 'Kranvagn', tier: 10, type: 'heavyTank', isPremium: false, baseIncome: 57000 },
                        { id: 'strv-103b', name: 'Strv 103B', tier: 10, type: 'AT-SPG', isPremium: false, baseIncome: 58000 },
                        { id: 'strv-s1', name: 'Strv S1', tier: 8, type: 'AT-SPG', isPremium: true, baseIncome: 79000 }
                    ]
                },
                'poland': {
                    name: 'Польша',
                    tanks: [
                        { id: '60tp', name: '60TP Lewandowskiego', tier: 10, type: 'heavyTank', isPremium: false, baseIncome: 58000 },
                        { id: 'cs-63', name: 'CS-63', tier: 10, type: 'mediumTank', isPremium: false, baseIncome: 56000 },
                        { id: '50tp-proto', name: '50TP prototyp', tier: 8, type: 'heavyTank', isPremium: true, baseIncome: 76000 }
                    ]
                },
                'italy': {
                    name: 'Италия',
                    tanks: [
                        { id: 'progetto-65', name: 'Progetto M40 mod. 65', tier: 10, type: 'mediumTank', isPremium: false, baseIncome: 57000 },
                        { id: 'progetto-46', name: 'Progetto M35 mod. 46', tier: 8, type: 'mediumTank', isPremium: true, baseIncome: 80000 },
                        { id: 'bisonte-c45', name: 'Bisonte C45', tier: 8, type: 'heavyTank', isPremium: true, baseIncome: 77000 }
                    ]
                }
            };

            // Загрузка данных из localStorage
            function loadNews() {
                const savedNews = localStorage.getItem('lesta_news');
                if (savedNews) {
                    return JSON.parse(savedNews);
                }
                return [];
            }

            function loadBonusCodes() {
                const savedCodes = localStorage.getItem('lesta_bonus_codes');
                if (savedCodes) {
                    return JSON.parse(savedCodes);
                }
                return [];
            }

            // Отображение новостей
            function displayNews() {
                const newsContainer = document.getElementById('newsContainer');
                const news = loadNews();
                
                if (news.length === 0) {
                    newsContainer.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--text-muted);">Нет добавленных новостей</div>';
                    return;
                }
                
                const html = news.map(item => `
                    <div class="news-card" onclick="openNewsModal(${item.id})">
                        ${item.image ? `<div class="news-card-image" style="background-image: url('${item.image}')"></div>` : '<div class="news-card-image"></div>'}
                        <div class="news-card-content">
                            <div class="news-date">${item.date}</div>
                            <div class="news-title">${item.title}</div>
                            <div class="news-description">${item.description || 'Описание отсутствует'}</div>
                            <div class="news-category">${item.category || 'Новости Мир Танков'}</div>
                        </div>
                    </div>
                `).join('');
                
                newsContainer.innerHTML = html;
            }

            // Открытие модального окна новости
            window.openNewsModal = function(id) {
                const news = loadNews();
                const item = news.find(n => n.id === id);
                
                if (!item) return;
                
                // Заполняем модальное окно
                document.getElementById('newsModalTitle').textContent = item.title;
                document.getElementById('newsModalDate').textContent = item.date;
                document.getElementById('newsModalText').textContent = item.description || 'Описание отсутствует';
                
                // Изображение
                const modalImage = document.getElementById('newsModalImage');
                if (item.image) {
                    modalImage.src = item.image;
                    modalImage.style.display = 'block';
                } else {
                    modalImage.style.display = 'none';
                }
                
                // Ссылка
                const modalLink = document.getElementById('newsModalLink');
                if (item.url) {
                    modalLink.href = item.url;
                    modalLink.style.display = 'inline-block';
                } else {
                    modalLink.style.display = 'none';
                }
                
                document.getElementById('newsModal').classList.add('active');
            };

            // Закрытие модального окна новости
            document.getElementById('closeNewsModal').addEventListener('click', () => {
                document.getElementById('newsModal').classList.remove('active');
            });

            document.getElementById('newsModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('newsModal')) {
                    document.getElementById('newsModal').classList.remove('active');
                }
            });

            // Отображение бонус-кодов
            function displayBonusCodes() {
                const bonusCodesList = document.getElementById('bonusCodesList');
                const codes = loadBonusCodes();
                
                if (codes.length === 0) {
                    bonusCodesList.innerHTML = '<div style="text-align: center; color: var(--text-muted);">Нет добавленных бонус-кодов</div>';
                    return;
                }
                
                const html = codes.map(code => `
                    <div class="bonus-code-item">
                        <div class="code">${code.code}</div>
                        <div class="reward">${code.description || 'Описание отсутствует'}</div>
                    </div>
                `).join('');
                
                bonusCodesList.innerHTML = html;
            }

            // Инициализация фильтров танков
            function initNations() {
                const nationSelect = document.getElementById('nationSelect');
                Object.keys(tanksDatabase).forEach(nationKey => {
                    const option = document.createElement('option');
                    option.value = nationKey;
                    option.textContent = tanksDatabase[nationKey].name;
                    nationSelect.appendChild(option);
                });
            }

            function filterAndPopulateTanks() {
                const nation = document.getElementById('nationSelect').value;
                const type = document.getElementById('typeSelect').value;
                const tier = document.getElementById('tierSelect').value;
                const tankSelect = document.getElementById('tankSelect');
                
                tankSelect.innerHTML = '<option value="">Выберите танк</option>';
                
                let allTanks = [];
                
                if (nation) {
                    allTanks = tanksDatabase[nation]?.tanks || [];
                } else {
                    Object.values(tanksDatabase).forEach(nationData => {
                        allTanks = allTanks.concat(nationData.tanks);
                    });
                }
                
                if (type) {
                    allTanks = allTanks.filter(tank => tank.type === type);
                }
                
                if (tier) {
                    allTanks = allTanks.filter(tank => tank.tier === parseInt(tier));
                }
                
                allTanks.forEach(tank => {
                    const option = document.createElement('option');
                    option.value = tank.id;
                    option.textContent = `${tank.name} (${tank.tier} ур.)${tank.isPremium ? ' ★' : ''}`;
                    tankSelect.appendChild(option);
                });
            }

            function loadTopTanks() {
                const topTanksList = document.getElementById('topTanksList');
                let allTanks = [];
                
                Object.values(tanksDatabase).forEach(nationData => {
                    allTanks = allTanks.concat(nationData.tanks);
                });
                
                const topTanks = allTanks
                    .filter(tank => tank.isPremium && tank.tier >= 8)
                    .sort((a, b) => b.baseIncome - a.baseIncome)
                    .slice(0, 10);
                
                const html = topTanks.map((tank, index) => `
                    <div class="tank-list-item">
                        <span>${index + 1}. ${tank.name}</span>
                        <span style="color: var(--accent-gold);">${tank.tier} ур. ★</span>
                    </div>
                `).join('');
                
                topTanksList.innerHTML = html;
            }

            function calculateIncome() {
                const tankId = document.getElementById('tankSelect').value;
                const battles = parseInt(document.getElementById('battlesInput').value) || 10;
                const isPremium = document.getElementById('premiumSelect').value === 'yes';
                
                if (!tankId) {
                    alert('Выберите танк');
                    return;
                }
                
                let tank = null;
                Object.values(tanksDatabase).forEach(nationData => {
                    const found = nationData.tanks.find(t => t.id === tankId);
                    if (found) tank = found;
                });
                
                if (!tank) {
                    alert('Танк не найден');
                    return;
                }
                
                let baseIncome = tank.baseIncome;
                
                if (isPremium) {
                    baseIncome *= 1.5;
                }
                
                if (tank.isPremium) {
                    baseIncome *= 1.2;
                }
                
                const totalIncome = baseIncome * battles;
                
                document.getElementById('avgIncome').textContent = Math.round(baseIncome).toLocaleString() + ' кредитов';
                document.getElementById('totalBattles').textContent = battles;
                document.getElementById('totalIncome').textContent = Math.round(totalIncome).toLocaleString() + ' кредитов';
                document.getElementById('resultBox').style.display = 'block';
            }

            // Инициализация модальных окон
            document.getElementById('btnFarm').addEventListener('click', () => {
                document.getElementById('farmModal').classList.add('active');
                loadTopTanks();
            });
            
            document.getElementById('btnCodes').addEventListener('click', () => {
                document.getElementById('codesModal').classList.add('active');
                displayBonusCodes();
            });
            
            document.getElementById('closeFarmModal').addEventListener('click', () => {
                document.getElementById('farmModal').classList.remove('active');
            });
            
            document.getElementById('closeCodesModal').addEventListener('click', () => {
                document.getElementById('codesModal').classList.remove('active');
            });
            
            window.addEventListener('click', (e) => {
                if (e.target === document.getElementById('farmModal')) {
                    document.getElementById('farmModal').classList.remove('active');
                }
                if (e.target === document.getElementById('codesModal')) {
                    document.getElementById('codesModal').classList.remove('active');
                }
            });
            
            // Обработчики фильтров
            document.getElementById('nationSelect').addEventListener('change', filterAndPopulateTanks);
            document.getElementById('typeSelect').addEventListener('change', filterAndPopulateTanks);
            document.getElementById('tierSelect').addEventListener('change', filterAndPopulateTanks);
            
            document.getElementById('calculateBtn').addEventListener('click', calculateIncome);
            
            // Инициализация
            initNations();
            filterAndPopulateTanks();
            displayNews();
            displayBonusCodes();
        })();
    </script>
</body>
</html>
