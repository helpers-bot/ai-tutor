    <style>
        :root {
            --bg-dark: #0b0f14;
            --bg-panel: #131a22;
            --bg-element: #1c2632;
            --border-color: #2a3744;
            --text-primary: #e6edf3;
            --text-secondary: #9aa7b3;
            --text-muted: #5c6b7a;
            --accent-gold: #d4af37;
            --accent-blue: #4a9eff;
            --accent-red: #ff5e5e;
            --accent-green: #3fb950;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1400px;
        }

        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .action-btn {
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 60px;
            padding: 0.8rem 2rem;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .btn-farm {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn-farm:hover {
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
        }

        .btn-codes {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-codes:hover {
            background: rgba(74, 158, 255, 0.1);
            box-shadow: 0 10px 25px rgba(74, 158, 255, 0.3);
        }

        .news-section {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .news-section h2 {
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.8rem;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .news-card {
            background: var(--bg-element);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .news-card-content {
            padding: 1.2rem;
        }

        .news-date {
            font-size: 0.8rem;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .news-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
            line-height: 1.3;
        }

        .news-category {
            font-size: 0.8rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--accent-gold);
            border-radius: 16px;
            padding: 2rem;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }

        .modal-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .farm-calculator {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .form-group select:focus, .form-group input:focus {
            border-color: var(--accent-gold);
        }

        .btn-calculate {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-calculate:hover {
            background: #ffd700;
            transform: translateY(-2px);
        }

        .result-box {
            background: var(--bg-element);
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .result-box h3 {
            color: var(--accent-green);
            margin-bottom: 0.5rem;
        }

        .bonus-code-item {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }

        .bonus-code-item .code {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .bonus-code-item .reward {
            color: var(--text-secondary);

            margin-top: 0.3rem;
        }

        .bonus-code-item .limit {
            color: var(--accent-red);
            font-size: 0.8rem;
            margin-top: 0.3rem;

            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

            .farm-calculator {

            }
            .top-buttons {
                gap: 1rem;
            }
            .action-btn {
                padding: 0.6rem 1.5rem;
                font-size: 1rem;
            }

    </style>

            // Инициализация
            function initNews() {
                const newsContainer = document.getElementById('newsContainer');
                const html = actualNews.map(news => `
                    <div class="news-card" onclick="window.open('${news.link}', '_blank')">
                        <div class="news-card-content">
                            <div class="news-date">${news.date}</div>
                            <div class="news-title">${news.title}</div>
                            <div class="news-category">${news.category}</div>
                        </div>
                    </div>
                `).join('');
                newsContainer.innerHTML = html;
            }

            function initNations() {
                const nationSelect = document.getElementById('nationSelect');
                Object.keys(tanksDatabase).forEach(nationKey => {
                    const option = document.createElement('option');
                    option.value = nationKey;
                    option.textContent = tanksDatabase[nationKey].name;
                    nationSelect.appendChild(option);
                });
            }

            function filterAndPopulateTanks() {
                const nation = document.getElementById('nationSelect').value;
                const type = document.getElementById('typeSelect').value;
                const tier = document.getElementById('tierSelect').value;
                const tankSelect = document.getElementById('tankSelect');
                
                tankSelect.innerHTML = '<option value="">Выберите танк</option>';
                
                let allTanks = [];
                
                if (nation) {
                    allTanks = tanksDatabase[nation]?.tanks || [];
                } else {
                    Object.values(tanksDatabase).forEach(nationData => {
                        allTanks = allTanks.concat(nationData.tanks);
                    });
                }
                
                if (type) {
                    allTanks = allTanks.filter(tank => tank.type === type);
                }
                
                if (tier) {
                    allTanks = allTanks.filter(tank => tank.tier === parseInt(tier));
                }
                
                allTanks.forEach(tank => {
                    const option = document.createElement('option');
                    option.value = tank.id;
                    option.textContent = `${tank.name} (${tank.tier} ур.)${tank.isPremium ? ' ★' : ''}`;
                    tankSelect.appendChild(option);
                });
            }

            function loadTopTanks() {
                const topTanksList = document.getElementById('topTanksList');
                let allTanks = [];
                
                Object.values(tanksDatabase).forEach(nationData => {
                    allTanks = allTanks.concat(nationData.tanks);
                });
                
                const topTanks = allTanks
                    .filter(tank => tank.isPremium && tank.tier >= 8)
                    .sort((a, b) => b.baseIncome - a.baseIncome)
                    .slice(0, 10);
                
                const html = topTanks.map((tank, index) => `
                    <div class="tank-list-item">
                        <span>${index + 1}. ${tank.name}</span>
                        <span style="color: var(--accent-gold);">${tank.tier} ур. ★</span>
                    </div>
                `).join('');
                
                topTanksList.innerHTML = html;
            }

            function calculateIncome() {
                const tankId = document.getElementById('tankSelect').value;
                const battles = parseInt(document.getElementById('battlesInput').value) || 10;
                const isPremium = document.getElementById('premiumSelect').value === 'yes';
                
                if (!tankId) {
                    alert('Выберите танк');
                    return;
                }
                
                let tank = null;
                Object.values(tanksDatabase).forEach(nationData => {
                    const found = nationData.tanks.find(t => t.id === tankId);
                    if (found) tank = found;
                });
                
                if (!tank) {
                    alert('Танк не найден');
                    return;
                }
                
                let baseIncome = tank.baseIncome;
                
                if (isPremium) {
                    baseIncome *= 1.5;
                }
                
                if (tank.isPremium) {
                    baseIncome *= 1.2;
                }
                
                const totalIncome = baseIncome * battles;
                
                document.getElementById('avgIncome').textContent = Math.round(baseIncome).toLocaleString() + ' кредитов';
                document.getElementById('totalBattles').textContent = battles;
                document.getElementById('totalIncome').textContent = Math.round(totalIncome).toLocaleString() + ' кредитов';
                document.getElementById('resultBox').style.display = 'block';
            }

            function loadBonusCodes() {
                const bonusCodesList = document.getElementById('bonusCodesList');
                const codes = [
                    { code: 'LESTA2026', reward: 'Премиум аккаунт на 7 дней', limit: 'Один раз на аккаунт' },
                    { code: 'TANKYOU', reward: 'Премиум танк VIII уровня (случайный)', limit: 'Один раз на аккаунт' },
                    { code: 'FARMCREDITS', reward: '1 000 000 кредитов', limit: 'Один раз на аккаунт' },
                    { code: 'BATTLES2026', reward: '3 дня премиум аккаунта + 500 золота', limit: 'Один раз на аккаунт' },
                    { code: 'CLANWARS', reward: 'Набор для клановых боёв', limit: 'Для участников кланов' },
                    { code: 'BIRTHDAY2026', reward: 'Подарочный набор', limit: 'До 31.08.2026' }
                ];
                
                const html = codes.map(code => `
                    <div class="bonus-code-item">
                        <div class="code">${code.code}</div>
                        <div class="reward">Награда: ${code.reward}</div>
                        <div class="limit">Лимит: ${code.limit}</div>
                    </div>
                `).join('');
                
                bonusCodesList.innerHTML = html;
            }

            // Инициализация модальных окон
            document.getElementById('btnFarm').addEventListener('click', () => {
                document.getElementById('farmModal').classList.add('active');
                loadTopTanks();
            });
            
            document.getElementById('btnCodes').addEventListener('click', () => {
                document.getElementById('codesModal').classList.add('active');
                loadBonusCodes();
            });
            
            document.getElementById('closeFarmModal').addEventListener('click', () => {
                document.getElementById('farmModal').classList.remove('active');
            });
            
            document.getElementById('closeCodesModal').addEventListener('click', () => {
                document.getElementById('codesModal').classList.remove('active');
            });
            
            window.addEventListener('click', (e) => {
                if (e.target === document.getElementById('farmModal')) {
                    document.getElementById('farmModal').classList.remove('active');
                }
                if (e.target === document.getElementById('codesModal')) {
                    document.getElementById('codesModal').classList.remove('active');
                }
            });
            
            // Обработчики фильтров
            document.getElementById('nationSelect').addEventListener('change', filterAndPopulateTanks);
            document.getElementById('typeSelect').addEventListener('change', filterAndPopulateTanks);
            document.getElementById('tierSelect').addEventListener('change', filterAndPopulateTanks);
            
            document.getElementById('calculateBtn').addEventListener('click', calculateIncome);
            
            // Инициализация
            initNews();
            initNations();
            filterAndPopulateTanks();
        })();
    </script>
</body>
</html>
