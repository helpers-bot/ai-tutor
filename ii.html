<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Humanoid - Интерактивный ИИ-человек</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #0a0a0a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
        }
        canvas { display: block; }

        .ui-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(10, 15, 30, 0.92);
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            min-width: 280px;
            max-height: 90vh;
            overflow-y: auto;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 150, 255, 0.15);
            z-index: 100;
        }

        .ui-panel h1 {
            font-size: 18px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .ui-panel .subtitle {
            font-size: 11px;
            color: #8899aa;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .section {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #00c8ff;
            margin-bottom: 10px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: rgba(0, 150, 255, 0.12);
            color: #cceeff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 200, 255, 0.15);
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: rgba(0, 180, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 150, 255, 0.3);
            border-color: rgba(0, 220, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: rgba(0, 200, 255, 0.35);
            border-color: #00c8ff;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
        }

        button.combat {
            background: rgba(255, 60, 60, 0.12);
            border-color: rgba(255, 80, 80, 0.2);
            color: #ffcccc;
        }

        button.combat:hover {
            background: rgba(255, 80, 80, 0.25);
            border-color: rgba(255, 100, 100, 0.4);
            box-shadow: 0 4px 15px rgba(255, 60, 60, 0.3);
        }

        button.combat.active {
            background: rgba(255, 60, 60, 0.4);
            border-color: #ff4444;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 60, 60, 0.4);
        }

        .learning-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .learning-progress {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border-radius: 3px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .status-display {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            line-height: 1.6;
            color: #aaccdd;
            font-family: 'Courier New', monospace;
        }

        .status-display span {
            color: #00ff88;
        }

        .neural-viz {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 120px;
            background: rgba(10, 15, 30, 0.9);
            border: 1px solid rgba(0, 200, 255, 0.2);
            border-radius: 12px;
            padding: 10px;
            backdrop-filter: blur(8px);
        }

        .neural-viz canvas {
            width: 100%;
            height: 100%;
        }

        .info-tip {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            color: #88aabb;
            pointer-events: none;
            opacity: 0.8;
        }

        .ui-panel::-webkit-scrollbar { width: 6px; }
        .ui-panel::-webkit-scrollbar-track { background: transparent; }
        .ui-panel::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.3); border-radius: 3px; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="ui-panel">
        <h1>AI HUMANOID</h1>
        <div class="subtitle">NEURAL NETWORK v2.0</div>

        <div class="section">
            <div class="section-title">Основные действия</div>
            <div class="btn-grid">
                <button id="btn-idle" class="active">Покой</button>
                <button id="btn-walk">Ходьба</button>
                <button id="btn-run">Бег</button>
                <button id="btn-jump">Прыжок</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Потребности</div>
            <div class="btn-grid">
                <button id="btn-eat">Есть</button>
                <button id="btn-drink">Пить</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Боевые искусства</div>
            <div class="btn-grid">
                <button id="btn-box" class="combat">Бокс</button>
                <button id="btn-muay" class="combat">Тайский бокс</button>
                <button id="btn-combat" class="combat">Рукопашный бой</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Прогресс обучения</div>
            <div style="font-size: 11px; color: #8899aa; margin-bottom: 5px;">
                Ходьба: <span id="learn-walk">0%</span>
            </div>
            <div class="learning-bar"><div class="learning-progress" id="bar-walk"></div></div>
            <div style="font-size: 11px; color: #8899aa; margin: 8px 0 5px;">
                Бег: <span id="learn-run">0%</span>
            </div>
            <div class="learning-bar"><div class="learning-progress" id="bar-run"></div></div>
            <div style="font-size: 11px; color: #8899aa; margin: 8px 0 5px;">
                Боевые искусства: <span id="learn-combat">0%</span>
            </div>
            <div class="learning-bar"><div class="learning-progress" id="bar-combat"></div></div>
        </div>

        <div class="section" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
            <div class="section-title">Статус ИИ</div>
            <div class="status-display" id="status-text">
                Состояние: <span>Инициализация...</span><br>
                Энергия: <span>100%</span><br>
                Гидратация: <span>100%</span><br>
                Сытость: <span>100%</span><br>
                Стресс: <span>0%</span>
            </div>
        </div>
    </div>

    <div class="neural-viz">
        <canvas id="neural-canvas"></canvas>
    </div>

    <div class="info-tip">ЛКМ — вращение камеры | ПКМ — перемещение | Колесико — зум</div>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        const CONFIG = {
            gravity: -9.82,
            timestep: 1/60,
            colors: {
                skin: 0xffdbac,
                joint: 0x333333,
                muscle: 0xcc8866,
                bone: 0xeeeeee,
                highlight: 0x00d4ff,
                combat: 0xff3333
            }
        };

        const AIState = {
            currentAction: 'idle',
            previousAction: 'idle',
            learningProgress: { walk: 0, run: 0, combat: 0, jump: 0, eat: 0, drink: 0 },
            stats: { energy: 100, hydration: 100, satiety: 100, stress: 0 },
            animationTime: 0,
            isGrounded: true
        };

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        scene.fog = new THREE.Fog(0x0a0a12, 10, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1, 0);
        controls.maxPolarAngle = Math.PI/2 - 0.05;

        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0x0088ff, 0.5);
        rimLight.position.set(-5, 5, -5);
        scene.add(rimLight);

        const fillLight = new THREE.DirectionalLight(0xffaa44, 0.3);
        fillLight.position.set(-5, 3, 5);
        scene.add(fillLight);

        const world = new CANNON.World();
        world.gravity.set(0, CONFIG.gravity, 0);
        world.broadphase = new CANNON.SAPBroadphase(world);
        world.solver.iterations = 20;
        world.solver.tolerance = 0.001;

        const groundMat = new CANNON.Material();
        const bodyMat = new CANNON.Material();
        const bodyGroundContact = new CANNON.ContactMaterial(groundMat, bodyMat, {
            friction: 0.8,
            restitution: 0.1
        });
        world.addContactMaterial(bodyGroundContact);

        const groundShape = new CANNON.Plane();
        const groundBody = new CANNON.Body({ mass: 0, material: groundMat });
        groundBody.addShape(groundShape);
        groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
        world.addBody(groundBody);

        const groundGeo = new THREE.PlaneGeometry(50, 50);
        const groundMeshMat = new THREE.MeshStandardMaterial({ 
            color: 0x111118,
            roughness: 0.8,
            metalness: 0.2
        });
        const groundMesh = new THREE.Mesh(groundGeo, groundMeshMat);
        groundMesh.rotation.x = -Math.PI/2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        const gridHelper = new THREE.GridHelper(50, 50, 0x1a3a5a, 0x0f1f2f);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        class HumanRagdoll {
            constructor() {
                this.parts = {};
                this.constraints = [];
                this.meshes = {};
                this.joints = [];
                this.createHuman();
            }

            createBoxShape(w, h, d) {
                return new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            }

            createBodyPart(name, shape, mass, pos, color) {
                const body = new CANNON.Body({ mass, material: bodyMat });
                body.addShape(shape);
                body.position.set(pos.x, pos.y, pos.z);
                body.linearDamping = 0.3;
                body.angularDamping = 0.3;
                world.addBody(body);

                const geo = new THREE.BoxGeometry(shape.halfExtents.x*2, shape.halfExtents.y*2, shape.halfExtents.z*2);
                const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);

                this.parts[name] = body;
                this.meshes[name] = mesh;
                return body;
            }

            createJoint(name, bodyA, bodyB, pivotA, pivotB, axisA, axisB) {
                const constraint = new CANNON.ConeTwistConstraint(bodyA, bodyB, {
                    pivotA: new CANNON.Vec3(pivotA.x, pivotA.y, pivotA.z),
                    pivotB: new CANNON.Vec3(pivotB.x, pivotB.y, pivotB.z),
                    axisA: new CANNON.Vec3(axisA.x, axisA.y, axisA.z),
                    axisB: new CANNON.Vec3(axisB.x, axisB.y, axisB.z),
                    collideConnected: false
                });
                world.addConstraint(constraint);
                this.constraints.push(constraint);

                const jointGeo = new THREE.SphereGeometry(0.04, 16, 16);
                const jointMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.joint, emissive: 0x111111 });
                const jointMesh = new THREE.Mesh(jointGeo, jointMat);
                scene.add(jointMesh);
                this.joints.push({ mesh: jointMesh, bodyA, bodyB, pivotA, pivotB });
                return constraint;
            }

            createHuman() {
                const c = CONFIG.colors;

                this.createBodyPart('pelvis', this.createBoxShape(0.28, 0.18, 0.22), 15, {x:0, y:1.0, z:0}, c.muscle);
                this.createBodyPart('abdomen', this.createBoxShape(0.26, 0.22, 0.20), 10, {x:0, y:1.25, z:0}, c.muscle);
                this.createJoint('spine_lower', this.parts.pelvis, this.parts.abdomen,
                    {x:0, y:0.09, z:0}, {x:0, y:-0.11, z:0}, {x:0, y:1, z:0}, {x:0, y:1, z:0});

                this.createBodyPart('chest', this.createBoxShape(0.30, 0.25, 0.22), 12, {x:0, y:1.55, z:0}, c.muscle);
                this.createJoint('spine_upper', this.parts.abdomen, this.parts.chest,
                    {x:0, y:0.11, z:0}, {x:0, y:-0.125, z:0}, {x:0, y:1, z:0}, {x:0, y:1, z:0});

                this.createBodyPart('neck', this.createBoxShape(0.10, 0.08, 0.10), 2, {x:0, y:1.75, z:0}, c.skin);
                this.createJoint('neck_joint', this.parts.chest, this.parts.neck,
                    {x:0, y:0.125, z:0}, {x:0, y:-0.04, z:0}, {x:0, y:1, z:0}, {x:0, y:1, z:0});

                this.createBodyPart('head', this.createBoxShape(0.18, 0.22, 0.20), 5, {x:0, y:1.95, z:0}, c.skin);
                this.createJoint('head_joint', this.parts.neck, this.parts.head,
                    {x:0, y:0.04, z:0}, {x:0, y:-0.11, z:0}, {x:0, y:1, z:0}, {x:0, y:1, z:0});

                this.createBodyPart('shoulderL', this.createBoxShape(0.10, 0.10, 0.10), 2, {x:0.20, y:1.60, z:0}, c.joint);
                this.createJoint('shoulderL_joint', this.parts.chest, this.parts.shoulderL,
                    {x:0.15, y:0.08, z:0}, {x:-0.05, y:0, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('upperArmL', this.createBoxShape(0.09, 0.28, 0.09), 4, {x:0.20, y:1.38, z:0}, c.skin);
                this.createJoint('elbowL_joint', this.parts.shoulderL, this.parts.upperArmL,
                    {x:0, y:-0.05, z:0}, {x:0, y:0.14, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('forearmL', this.createBoxShape(0.08, 0.26, 0.08), 3, {x:0.20, y:1.10, z:0}, c.skin);
                this.createJoint('wristL_joint', this.parts.upperArmL, this.parts.forearmL,
                    {x:0, y:-0.14, z:0}, {x:0, y:0.13, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('handL', this.createBoxShape(0.07, 0.09, 0.09), 1, {x:0.20, y:0.88, z:0}, c.skin);
                this.createJoint('handL_joint', this.parts.forearmL, this.parts.handL,
                    {x:0, y:-0.13, z:0}, {x:0, y:0.045, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('shoulderR', this.createBoxShape(0.10, 0.10, 0.10), 2, {x:-0.20, y:1.60, z:0}, c.joint);
                this.createJoint('shoulderR_joint', this.parts.chest, this.parts.shoulderR,
                    {x:-0.15, y:0.08, z:0}, {x:0.05, y:0, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('upperArmR', this.createBoxShape(0.09, 0.28, 0.09), 4, {x:-0.20, y:1.38, z:0}, c.skin);
                this.createJoint('elbowR_joint', this.parts.shoulderR, this.parts.upperArmR,
                    {x:0, y:-0.05, z:0}, {x:0, y:0.14, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('forearmR', this.createBoxShape(0.08, 0.26, 0.08), 3, {x:-0.20, y:1.10, z:0}, c.skin);
                this.createJoint('wristR_joint', this.parts.upperArmR, this.parts.forearmR,
                    {x:0, y:-0.14, z:0}, {x:0, y:0.13, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('handR', this.createBoxShape(0.07, 0.09, 0.09), 1, {x:-0.20, y:0.88, z:0}, c.skin);
                this.createJoint('handR_joint', this.parts.forearmR, this.parts.handR,
                    {x:0, y:-0.13, z:0}, {x:0, y:0.045, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('thighL', this.createBoxShape(0.13, 0.38, 0.13), 8, {x:0.10, y:0.72, z:0}, 0x334455);
                this.createJoint('hipL_joint', this.parts.pelvis, this.parts.thighL,
                    {x:0.08, y:-0.09, z:0}, {x:0, y:0.19, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('shinL', this.createBoxShape(0.11, 0.36, 0.11), 6, {x:0.10, y:0.34, z:0}, 0x334455);
                this.createJoint('kneeL_joint', this.parts.thighL, this.parts.shinL,
                    {x:0, y:-0.19, z:0}, {x:0, y:0.18, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('footL', this.createBoxShape(0.10, 0.06, 0.20), 2, {x:0.10, y:0.10, z:0.04}, 0x222222);
                this.createJoint('ankleL_joint', this.parts.shinL, this.parts.footL,
                    {x:0, y:-0.18, z:0}, {x:0, y:0.03, z:-0.04}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('thighR', this.createBoxShape(0.13, 0.38, 0.13), 8, {x:-0.10, y:0.72, z:0}, 0x334455);
                this.createJoint('hipR_joint', this.parts.pelvis, this.parts.thighR,
                    {x:-0.08, y:-0.09, z:0}, {x:0, y:0.19, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('shinR', this.createBoxShape(0.11, 0.36, 0.11), 6, {x:-0.10, y:0.34, z:0}, 0x334455);
                this.createJoint('kneeR_joint', this.parts.thighR, this.parts.shinR,
                    {x:0, y:-0.19, z:0}, {x:0, y:0.18, z:0}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.createBodyPart('footR', this.createBoxShape(0.10, 0.06, 0.20), 2, {x:-0.10, y:0.10, z:0.04}, 0x222222);
                this.createJoint('ankleR_joint', this.parts.shinR, this.parts.footR,
                    {x:0, y:-0.18, z:0}, {x:0, y:0.03, z:-0.04}, {x:1, y:0, z:0}, {x:1, y:0, z:0});

                this.enhanceAppearance();
            }

            enhanceAppearance() {
                const eyeGeo = new THREE.SphereGeometry(0.025, 16, 16);
                const eyeMat = new THREE.MeshStandardMaterial({ 
                    color: 0x00d4ff, emissive: 0x0088ff, emissiveIntensity: 0.5
                });
                const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
                eyeL.position.set(0.06, 1.98, 0.10);
                scene.add(eyeL);
                const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
                eyeR.position.set(-0.06, 1.98, 0.10);
                scene.add(eyeR);
                this.meshes['eyeL'] = eyeL;
                this.meshes['eyeR'] = eyeR;

                const hairGeo = new THREE.BoxGeometry(0.20, 0.08, 0.22);
                const hairMat = new THREE.MeshStandardMaterial({ color: 0x221100 });
                const hair = new THREE.Mesh(hairGeo, hairMat);
                hair.position.set(0, 2.08, 0);
                scene.add(hair);
                this.meshes['hair'] = hair;
            }

            update() {
                for (const [name, body] of Object.entries(this.parts)) {
                    if (this.meshes[name]) {
                        this.meshes[name].position.copy(body.position);
                        this.meshes[name].quaternion.copy(body.quaternion);
                    }
                }

                for (const joint of this.joints) {
                    const posA = new CANNON.Vec3();
                    joint.bodyA.pointToWorldFrame(
                        new CANNON.Vec3(joint.pivotA.x, joint.pivotA.y, joint.pivotA.z), posA);
                    joint.mesh.position.set(posA.x, posA.y, posA.z);
                }

                if (this.parts.head) {
                    const headPos = this.parts.head.position;
                    const headQuat = this.parts.head.quaternion;
                    const offsetL = new CANNON.Vec3(0.06, 0.03, 0.10);
                    const offsetR = new CANNON.Vec3(-0.06, 0.03, 0.10);
                    headQuat.vmult(offsetL, offsetL);
                    headQuat.vmult(offsetR, offsetR);

                    if (this.meshes.eyeL) {
                        this.meshes.eyeL.position.set(headPos.x + offsetL.x, headPos.y + offsetL.y, headPos.z + offsetL.z);
                        this.meshes.eyeL.quaternion.copy(headQuat);
                    }
                    if (this.meshes.eyeR) {
                        this.meshes.eyeR.position.set(headPos.x + offsetR.x, headPos.y + offsetR.y, headPos.z + offsetR.z);
                        this.meshes.eyeR.quaternion.copy(headQuat);
                    }
                    if (this.meshes.hair) {
                        const hairOffset = new CANNON.Vec3(0, 0.13, 0);
                        headQuat.vmult(hairOffset, hairOffset);
                        this.meshes.hair.position.set(headPos.x + hairOffset.x, headPos.y + hairOffset.y, headPos.z + hairOffset.z);
                        this.meshes.hair.quaternion.copy(headQuat);
                    }
                }
            }

            resetPosition() {
                const startY = 1.0;
                this.parts.pelvis.position.set(0, startY, 0);
                this.parts.pelvis.velocity.set(0, 0, 0);
                this.parts.pelvis.angularVelocity.set(0, 0, 0);
                this.parts.pelvis.quaternion.set(0, 0, 0, 1);

                const offsets = {
                    abdomen: {x:0, y:0.25, z:0}, chest: {x:0, y:0.55, z:0},
                    neck: {x:0, y:0.75, z:0}, head: {x:0, y:0.95, z:0},
                    shoulderL: {x:0.20, y:0.60, z:0}, upperArmL: {x:0.20, y:0.38, z:0},
                    forearmL: {x:0.20, y:0.10, z:0}, handL: {x:0.20, y:-0.12, z:0},
                    shoulderR: {x:-0.20, y:0.60, z:0}, upperArmR: {x:-0.20, y:0.38, z:0},
                    forearmR: {x:-0.20, y:0.10, z:0}, handR: {x:-0.20, y:-0.12, z:0},
                    thighL: {x:0.10, y:-0.28, z:0}, shinL: {x:0.10, y:-0.66, z:0},
                    footL: {x:0.10, y:-0.90, z:0.04}, thighR: {x:-0.10, y:-0.28, z:0},
                    shinR: {x:-0.10, y:-0.66, z:0}, footR: {x:-0.10, y:-0.90, z:0.04}
                };

                for (const [name, offset] of Object.entries(offsets)) {
                    if (this.parts[name]) {
                        this.parts[name].position.set(
                            this.parts.pelvis.position.x + offset.x,
                            this.parts.pelvis.position.y + offset.y,
                            this.parts.pelvis.position.z + offset.z
                        );
                        this.parts[name].velocity.set(0, 0, 0);
                        this.parts[name].angularVelocity.set(0, 0, 0);
                        this.parts[name].quaternion.set(0, 0, 0, 1);
                    }
                }
            }
        }

        class AnimationSystem {
            constructor(human) {
                this.human = human;
                this.time = 0;
                this.walkCycle = 0;
                this.balanceForce = 800;
            }

            applyBalance() {
                const pelvis = this.human.parts.pelvis;
                const targetY = 1.0;
                const error = targetY - pelvis.position.y;

                if (Math.abs(error) > 0.01) {
                    pelvis.applyForce(new CANNON.Vec3(0, error * this.balanceForce, 0), pelvis.position);
                }

                pelvis.applyForce(new CANNON.Vec3(-pelvis.position.x * 200, 0, -pelvis.position.z * 200), pelvis.position);
                pelvis.angularVelocity.x *= 0.95;
                pelvis.angularVelocity.z *= 0.95;
            }

            animateIdle(dt) {
                this.applyBalance();
                const t = this.time;
                const breath = Math.sin(t * 2) * 0.02;
                this.human.parts.chest.position.y += breath * 0.01;
                this.applyJointTorque('upperArmL', 0, 0, Math.sin(t) * 0.5);
                this.applyJointTorque('upperArmR', 0, 0, -Math.sin(t) * 0.5);
            }

            animateWalk(dt) {
                this.applyBalance();
                const speed = 4;
                this.walkCycle += dt * speed;
                const t = this.walkCycle;

                const legAmp = 0.6;
                this.applyJointTorque('thighL', Math.sin(t) * legAmp, 0, 0);
                this.applyJointTorque('thighR', Math.sin(t + Math.PI) * legAmp, 0, 0);
                this.applyJointTorque('shinL', Math.max(0, Math.sin(t)) * 0.8, 0, 0);
                this.applyJointTorque('shinR', Math.max(0, Math.sin(t + Math.PI)) * 0.8, 0, 0);

                const armAmp = 0.5;
                this.applyJointTorque('upperArmL', Math.sin(t + Math.PI) * armAmp, 0, 0.3);
                this.applyJointTorque('upperArmR', Math.sin(t) * armAmp, 0, -0.3);
                this.applyJointTorque('abdomen', 0.2, 0, 0);
                this.human.parts.pelvis.applyForce(new CANNON.Vec3(0, 0, 150), this.human.parts.pelvis.position);
            }

            animateRun(dt) {
                this.applyBalance();
                const speed = 8;
                this.walkCycle += dt * speed;
                const t = this.walkCycle;

                const legAmp = 1.2;
                this.applyJointTorque('thighL', Math.sin(t) * legAmp, 0, 0);
                this.applyJointTorque('thighR', Math.sin(t + Math.PI) * legAmp, 0, 0);
                this.applyJointTorque('shinL', Math.max(0, Math.sin(t)) * 1.5, 0, 0);
                this.applyJointTorque('shinR', Math.max(0, Math.sin(t + Math.PI)) * 1.5, 0, 0);

                const armAmp = 1.0;
                this.applyJointTorque('upperArmL', Math.sin(t + Math.PI) * armAmp, 0, 0.5);
                this.applyJointTorque('upperArmR', Math.sin(t) * armAmp, 0, -0.5);
                this.applyJointTorque('forearmL', -0.5, 0, 0);
                this.applyJointTorque('forearmR', -0.5, 0, 0);
                this.applyJointTorque('abdomen', 0.4, 0, 0);
                this.applyJointTorque('chest', 0.1, 0, 0);
                this.human.parts.pelvis.applyForce(new CANNON.Vec3(0, 0, 300), this.human.parts.pelvis.position);

                if (Math.sin(t) > 0.8 && this.human.parts.pelvis.position.y < 1.1) {
                    this.human.parts.pelvis.applyForce(new CANNON.Vec3(0, 200, 0), this.human.parts.pelvis.position);
                }
            }

            animateJump(dt) {
                this.applyBalance();
                const pelvis = this.human.parts.pelvis;

                if (this.time < 0.3) {
                    this.applyJointTorque('thighL', -0.8, 0, 0);
                    this.applyJointTorque('thighR', -0.8, 0, 0);
                    this.applyJointTorque('shinL', 1.0, 0, 0);
                    this.applyJointTorque('shinR', 1.0, 0, 0);
                    this.applyJointTorque('abdomen', -0.3, 0, 0);
                } else if (this.time < 0.5) {
                    this.applyJointTorque('thighL', 1.5, 0, 0);
                    this.applyJointTorque('thighR', 1.5, 0, 0);
                    this.applyJointTorque('shinL', -0.5, 0, 0);
                    this.applyJointTorque('shinR', -0.5, 0, 0);
                    pelvis.applyForce(new CANNON.Vec3(0, 800, 100), pelvis.position);
                    this.applyJointTorque('upperArmL', -2.0, 0, 0);
                    this.applyJointTorque('upperArmR', -2.0, 0, 0);
                } else {
                    this.applyJointTorque('thighL', -0.3, 0, 0);
                    this.applyJointTorque('thighR', -0.3, 0, 0);
                    this.applyJointTorque('shinL', 0.5, 0, 0);
                    this.applyJointTorque('shinR', 0.5, 0, 0);
                }
            }

            animateEat(dt) {
                this.applyBalance();
                const t = this.time * 3;
                this.applyJointTorque('upperArmR', -1.2, 0, -0.5);
                this.applyJointTorque('forearmR', -2.0, 0, 0);
                this.applyJointTorque('handR', -0.5, 0, 0);
                this.applyJointTorque('upperArmL', -0.5, 0, 0.3);
                this.applyJointTorque('forearmL', -1.0, 0, 0);
                this.applyJointTorque('head', Math.sin(t * 4) * 0.1, 0, 0);
                this.applyJointTorque('abdomen', 0.2, 0, 0);
            }

            animateDrink(dt) {
                this.applyBalance();
                const t = this.time * 2;
                this.applyJointTorque('upperArmR', -1.0, 0, -0.3);
                this.applyJointTorque('forearmR', -1.8, 0, 0);
                this.applyJointTorque('handR', -0.8, 0, 0);
                this.applyJointTorque('head', -0.3 + Math.sin(t) * 0.1, 0, 0);
                this.applyJointTorque('neck', -0.2, 0, 0);
                this.applyJointTorque('chest', Math.sin(t * 2) * 0.05, 0, 0);
            }

            animateBox(dt) {
                this.applyBalance();
                const t = this.time * 5;
                const combo = Math.floor(this.time * 2) % 4;

                this.applyJointTorque('thighL', -0.3, 0, 0.3);
                this.applyJointTorque('thighR', -0.3, 0, -0.3);
                this.applyJointTorque('shinL', 0.4, 0, 0);
                this.applyJointTorque('shinR', 0.4, 0, 0);
                this.applyJointTorque('upperArmL', -1.5, 0, 0.8);
                this.applyJointTorque('forearmL', -2.0, 0, 0);
                this.applyJointTorque('upperArmR', -1.5, 0, -0.8);
                this.applyJointTorque('forearmR', -2.0, 0, 0);

                if (combo === 0) {
                    this.applyJointTorque('upperArmL', -0.5, 0, 1.5);
                    this.applyJointTorque('forearmL', -1.0, 0, 0);
                } else if (combo === 1) {
                    this.applyJointTorque('upperArmR', -0.5, 0, -1.5);
                    this.applyJointTorque('forearmR', -1.0, 0, 0);
                } else if (combo === 2) {
                    this.applyJointTorque('upperArmL', -1.0, 0, 2.0);
                    this.applyJointTorque('forearmL', -1.5, 0, 0);
                } else {
                    this.applyJointTorque('upperArmR', -2.0, 0, -0.5);
                    this.applyJointTorque('forearmR', -2.5, 0, 0);
                }

                this.applyJointTorque('abdomen', 0.1, Math.sin(t) * 0.3, 0);
                this.applyJointTorque('chest', 0.05, Math.sin(t * 0.5) * 0.2, 0);
            }

            animateMuayThai(dt) {
                this.applyBalance();
                const t = this.time * 4;
                const phase = Math.floor(this.time * 1.5) % 5;

                this.applyJointTorque('thighL', -0.4, 0, 0.5);
                this.applyJointTorque('thighR', -0.4, 0, -0.5);
                this.applyJointTorque('shinL', 0.3, 0, 0);
                this.applyJointTorque('shinR', 0.3, 0, 0);
                this.applyJointTorque('upperArmL', -2.0, 0, 0.5);
                this.applyJointTorque('forearmL', -2.5, 0, 0);
                this.applyJointTorque('upperArmR', -2.0, 0, -0.5);
                this.applyJointTorque('forearmR', -2.5, 0, 0);

                if (phase === 0) {
                    this.applyJointTorque('thighR', -1.5, 0, -1.0);
                    this.applyJointTorque('shinR', -2.0, 0, 0);
                    this.applyJointTorque('footR', -0.5, 0, 0);
                } else if (phase === 1) {
                    this.applyJointTorque('thighL', -1.0, 0, 0.5);
                    this.applyJointTorque('shinL', -2.5, 0, 0);
                } else if (phase === 2) {
                    this.applyJointTorque('upperArmR', -1.0, 0, -1.5);
                    this.applyJointTorque('forearmR', -2.5, 0, 0);
                } else if (phase === 3) {
                    this.applyJointTorque('thighL', -1.5, 0, 1.0);
                    this.applyJointTorque('shinL', -2.0, 0, 0);
                } else {
                    this.applyJointTorque('abdomen', 0.2, 0, 0);
                }

                this.applyJointTorque('abdomen', 0.1, Math.sin(t) * 0.2, 0);
            }

            animateCombat(dt) {
                this.applyBalance();
                const t = this.time * 3;
                const phase = Math.floor(this.time) % 6;

                this.applyJointTorque('thighL', -0.5, 0, 0.2);
                this.applyJointTorque('thighR', -0.3, 0, -0.2);
                this.applyJointTorque('shinL', 0.5, 0, 0);
                this.applyJointTorque('shinR', 0.3, 0, 0);
                this.applyJointTorque('upperArmL', -0.8, 0, 0.5);
                this.applyJointTorque('forearmL', -1.5, 0, 0);
                this.applyJointTorque('upperArmR', -0.8, 0, -0.5);
                this.applyJointTorque('forearmR', -1.5, 0, 0);

                if (phase === 0) {
                    this.applyJointTorque('forearmL', -2.5, 0, 0);
                    this.applyJointTorque('forearmR', -2.5, 0, 0);
                } else if (phase === 1) {
                    this.applyJointTorque('upperArmR', -0.3, 0, -1.5);
                    this.applyJointTorque('forearmR', -1.0, 0, 0);
                } else if (phase === 2) {
                    this.applyJointTorque('upperArmL', -0.5, 0, 1.0);
                    this.applyJointTorque('upperArmR', -0.5, 0, -1.0);
                    this.applyJointTorque('forearmL', -1.5, 0, 0);
                    this.applyJointTorque('forearmR', -1.5, 0, 0);
                } else if (phase === 3) {
                    this.applyJointTorque('abdomen', 0.5, 0, 0);
                    this.applyJointTorque('chest', 0.3, 0, 0);
                    this.applyJointTorque('thighL', -1.0, 0, 0.5);
                } else if (phase === 4) {
                    this.applyJointTorque('thighR', -1.2, 0, -0.8);
                    this.applyJointTorque('shinR', -2.0, 0, 0);
                } else {
                    this.applyJointTorque('head', -0.2, 0, 0);
                }

                this.applyJointTorque('abdomen', 0.1, Math.sin(t) * 0.3, 0);
                this.applyJointTorque('chest', 0.05, Math.cos(t) * 0.2, 0);
            }

            applyJointTorque(partName, x, y, z) {
                if (this.human.parts[partName]) {
                    const body = this.human.parts[partName];
                    const torque = new CANNON.Vec3(x * 20, y * 20, z * 20);
                    body.torque.vadd(torque, body.torque);
                }
            }

            update(action, dt) {
                this.time += dt;
                switch(action) {
                    case 'idle': this.animateIdle(dt); break;
                    case 'walk': this.animateWalk(dt); break;
                    case 'run': this.animateRun(dt); break;
                    case 'jump': this.animateJump(dt); break;
                    case 'eat': this.animateEat(dt); break;
                    case 'drink': this.animateDrink(dt); break;
                    case 'box': this.animateBox(dt); break;
                    case 'muay': this.animateMuayThai(dt); break;
                    case 'combat': this.animateCombat(dt); break;
                }
            }

            reset() {
                this.time = 0;
                this.walkCycle = 0;
            }
        }

        class NeuralVisualizer {
            constructor() {
                this.canvas = document.getElementById('neural-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.canvas.width = 200;
                this.canvas.height = 120;
                this.nodes = [];
                this.connections = [];
                this.initNetwork();
            }

            initNetwork() {
                for (let i = 0; i < 20; i++) {
                    this.nodes.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        activation: Math.random()
                    });
                }
                for (let i = 0; i < this.nodes.length; i++) {
                    for (let j = i + 1; j < this.nodes.length; j++) {
                        if (Math.random() < 0.15) {
                            this.connections.push({ from: i, to: j, weight: Math.random() });
                        }
                    }
                }
            }

            update(action) {
                const ctx = this.ctx;
                ctx.fillStyle = 'rgba(10, 15, 30, 0.3)';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.nodes.forEach(node => {
                    node.x += node.vx;
                    node.y += node.vy;
                    if (node.x < 0 || node.x > this.canvas.width) node.vx *= -1;
                    if (node.y < 0 || node.y > this.canvas.height) node.vy *= -1;

                    const baseActivation = action === 'idle' ? 0.3 : 
                                          action === 'walk' ? 0.5 :
                                          action === 'run' ? 0.7 :
                                          action === 'combat' || action === 'box' || action === 'muay' ? 0.9 : 0.4;
                    node.activation += (baseActivation + Math.random() * 0.2 - node.activation) * 0.1;
                });

                this.connections.forEach(conn => {
                    const from = this.nodes[conn.from];
                    const to = this.nodes[conn.to];
                    const avgActivation = (from.activation + to.activation) / 2;

                    ctx.beginPath();
                    ctx.moveTo(from.x, from.y);
                    ctx.lineTo(to.x, to.y);
                    ctx.strokeStyle = `rgba(0, 200, 255, ${avgActivation * 0.3})`;
                    ctx.lineWidth = avgActivation * 1.5;
                    ctx.stroke();
                });

                this.nodes.forEach(node => {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, 2 + node.activation * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 212, 255, ${0.4 + node.activation * 0.6})`;
                    ctx.fill();
                });
            }
        }

        const human = new HumanRagdoll();
        const animator = new AnimationSystem(human);
        const neuralViz = new NeuralVisualizer();

        const buttons = {
            idle: document.getElementById('btn-idle'),
            walk: document.getElementById('btn-walk'),
            run: document.getElementById('btn-run'),
            jump: document.getElementById('btn-jump'),
            eat: document.getElementById('btn-eat'),
            drink: document.getElementById('btn-drink'),
            box: document.getElementById('btn-box'),
            muay: document.getElementById('btn-muay'),
            combat: document.getElementById('btn-combat')
        };

        const learningBars = {
            walk: document.getElementById('bar-walk'),
            run: document.getElementById('bar-run'),
            combat: document.getElementById('bar-combat')
        };

        const learningTexts = {
            walk: document.getElementById('learn-walk'),
            run: document.getElementById('learn-run'),
            combat: document.getElementById('learn-combat')
        };

        const statusText = document.getElementById('status-text');

        function setActiveButton(action) {
            Object.values(buttons).forEach(btn => btn.classList.remove('active'));
            if (buttons[action]) buttons[action].classList.add('active');
        }

        function updateLearning(action, dt) {
            const learnMap = { walk: 'walk', run: 'run', box: 'combat', muay: 'combat', combat: 'combat' };
            const key = learnMap[action];
            if (key && AIState.learningProgress[key] < 100) {
                AIState.learningProgress[key] += dt * 8;
                if (AIState.learningProgress[key] > 100) AIState.learningProgress[key] = 100;
                learningBars[key].style.width = AIState.learningProgress[key] + '%';
                learningTexts[key].textContent = Math.floor(AIState.learningProgress[key]) + '%';
            }
        }

        function updateStatus(action) {
            const stateNames = {
                idle: 'Покой', walk: 'Ходьба', run: 'Бег', jump: 'Прыжок',
                eat: 'Приём пищи', drink: 'Питьё', box: 'Бокс',
                muay: 'Тайский бокс', combat: 'Рукопашный бой'
            };

            if (action === 'run') {
                AIState.stats.energy = Math.max(0, AIState.stats.energy - 0.05);
                AIState.stats.hydration = Math.max(0, AIState.stats.hydration - 0.03);
            } else if (action === 'walk') {
                AIState.stats.energy = Math.max(0, AIState.stats.energy - 0.01);
            } else if (action === 'combat' || action === 'box' || action === 'muay') {
                AIState.stats.energy = Math.max(0, AIState.stats.energy - 0.08);
                AIState.stats.stress = Math.min(100, AIState.stats.stress + 0.05);
            } else if (action === 'eat') {
                AIState.stats.satiety = Math.min(100, AIState.stats.satiety + 0.1);
                AIState.stats.energy = Math.min(100, AIState.stats.energy + 0.02);
            } else if (action === 'drink') {
                AIState.stats.hydration = Math.min(100, AIState.stats.hydration + 0.15);
                AIState.stats.stress = Math.max(0, AIState.stats.stress - 0.02);
            } else if (action === 'idle') {
                AIState.stats.energy = Math.min(100, AIState.stats.energy + 0.03);
                AIState.stats.stress = Math.max(0, AIState.stats.stress - 0.01);
            }

            statusText.innerHTML = `
                Состояние: <span>${stateNames[action] || action}</span><br>
                Энергия: <span>${Math.floor(AIState.stats.energy)}%</span><br>
                Гидратация: <span>${Math.floor(AIState.stats.hydration)}%</span><br>
                Сытость: <span>${Math.floor(AIState.stats.satiety)}%</span><br>
                Стресс: <span>${Math.floor(AIState.stats.stress)}%</span>
            `;
        }

        function setAction(action) {
            if (AIState.currentAction === action) return;

            AIState.previousAction = AIState.currentAction;
            AIState.currentAction = action;
            animator.reset();

            if (action === 'jump') {
                setTimeout(() => {
                    if (AIState.currentAction === 'jump') {
                        setAction('idle');
                    }
                }, 1500);
            }

            setActiveButton(action);
        }

        Object.keys(buttons).forEach(action => {
            buttons[action].addEventListener('click', () => setAction(action));
        });

        document.addEventListener('keydown', (e) => {
            const keyMap = {
                '1': 'idle', '2': 'walk', '3': 'run', '4': 'jump',
                '5': 'eat', '6': 'drink', '7': 'box', '8': 'muay', '9': 'combat'
            };
            if (keyMap[e.key]) setAction(keyMap[e.key]);
        });

        let lastTime = performance.now();
        let frameCount = 0;

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;
            frameCount++;

            world.step(CONFIG.timestep);
            animator.update(AIState.currentAction, dt);
            human.update();
            updateLearning(AIState.currentAction, dt);
            updateStatus(AIState.currentAction);

            if (frameCount % 3 === 0) {
                neuralViz.update(AIState.currentAction);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        human.resetPosition();
        animate();
    </script>
</body>
